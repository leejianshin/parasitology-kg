name: Validate knowledge schema

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Validate formal knowledge
        run: python scripts/validate_knowledge.py
      - name: Validate positive fixture
        run: >-
          python scripts/validate_knowledge.py
          --knowledge-dir tests/fixtures/knowledge
          --source-registry tests/fixtures/source-registry.yml
      - name: Validate relation schema decisions
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate Phase 5 admission plan
        run: python scripts/validate_phase5_admission.py
      - name: Check deterministic derived graph
        run: python scripts/build_derived_graph.py --check
      - name: Validate Phase 5 Batch 1 intake
        run: python scripts/validate_phase5_batch1_intake.py
      - name: Check Phase 6 allowlisted RAG corpus
        run: python scripts/build_phase6_rag_corpus.py --check
      - name: Validate Phase 6 student RAG protocol
        run: python scripts/validate_phase6_protocol.py
      - name: Validate PCMS authority and adjudication bundle
        run: python scripts/validate_pcms.py
      - name: Check PCMS aggregate graph
        run: python scripts/build_pcms_graph.py --check
      - name: Check PCMS fixed regression report
        run: python scripts/validate_pcms_regression.py --check
