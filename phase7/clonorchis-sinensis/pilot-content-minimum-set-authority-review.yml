      - {claim_id: PCMS-008, subject: parasite.clonorchis_sinensis, predicate: has_life_cycle_stage, object: stage.clonorchis_miracidium, claim: "华支睾吸虫具有毛蚴阶段。"}
      - {claim_id: PCMS-009, subject: parasite.clonorchis_sinensis, predicate: has_life_cycle_stage, object: stage.clonorchis_sporocyst, claim: "华支睾吸虫具有胞蚴阶段。"}
      - {claim_id: PCMS-010, subject: parasite.clonorchis_sinensis, predicate: has_life_cycle_stage, object: stage.clonorchis_redia, claim: "华支睾吸虫具有雷蚴阶段。"}
      - {claim_id: PCMS-011, subject: parasite.clonorchis_sinensis, predicate: has_life_cycle_stage, object: stage.clonorchis_cercaria, claim: "华支睾吸虫具有尾蚴阶段。"}
      - {claim_id: PCMS-012, subject: parasite.clonorchis_sinensis, predicate: has_life_cycle_stage, object: stage.clonorchis_metacercaria, claim: "华支睾吸虫具有囊蚴阶段。"}
      - {claim_id: PCMS-013, subject: parasite.clonorchis_sinensis, predicate: has_life_cycle_stage, object: stage.clonorchis_adult, claim: "华支睾吸虫具有成虫阶段。"}
