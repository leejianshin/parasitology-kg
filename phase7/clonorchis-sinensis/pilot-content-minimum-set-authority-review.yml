    recommendation: "APPROVE_WITH_CONTEXT_QUALIFIERS"
    schema_mode: "existing_relations"
    claims:
      - {claim_id: PCMS-014, subject: stage.clonorchis_egg, predicate: develops_into, object: stage.clonorchis_miracidium, claim: "虫卵被适宜螺宿主摄入后释放毛蚴。", condition: "within_suitable_snail_host"}
      - {claim_id: PCMS-015, subject: stage.clonorchis_miracidium, predicate: develops_into, object: stage.clonorchis_sporocyst, claim: "毛蚴在适宜螺宿主体内发育为胞蚴。", condition: "within_suitable_snail_host"}
      - {claim_id: PCMS-016, subject: stage.clonorchis_sporocyst, predicate: develops_into, object: stage.clonorchis_redia, claim: "胞蚴在适宜螺宿主体内发育为雷蚴。", condition: "within_suitable_snail_host"}
      - {claim_id: PCMS-017, subject: stage.clonorchis_redia, predicate: develops_into, object: stage.clonorchis_cercaria, claim: "雷蚴在适宜螺宿主体内发育为尾蚴。", condition: "within_suitable_snail_host"}
      - {claim_id: PCMS-018, subject: stage.clonorchis_cercaria, predicate: develops_into, object: stage.clonorchis_metacercaria, claim: "尾蚴离开螺后侵入淡水鱼并形成囊蚴。", condition: "within_freshwater_fish"}
      - {claim_id: PCMS-019, subject: stage.clonorchis_metacercaria, predicate: develops_into, object: stage.clonorchis_adult, claim: "终宿主摄入活囊蚴后，幼虫进入胆道并发育为成虫。", condition: "after_ingestion_by_definitive_host"}
    common_evidence:
