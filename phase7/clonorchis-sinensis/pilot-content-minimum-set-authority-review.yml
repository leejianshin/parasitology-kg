      - claim_id: PCMS-029
        subject: disease.clonorchiasis
        predicate: diagnosed_by
        object: diagnostic.duodenal_fluid_egg_microscopy
        claim: "十二指肠液中检出华支睾吸虫卵可作为病原学确证证据。"
        decision_flag: "TEACHER_DECISION_REQUIRED"
        evidence:
          - {source_id: source.pmph_human_parasitology_10e_2024, locator: "印刷页96【实验诊断】"}
          - {source_id: source.nhc_ws309_2009, locator: "诊断标准及附录；标准自2016-12-28转为推荐性"}
        limitation: "WHO当前社区诊断页面重点列粪便检卵，未陈述十二指肠液检查的常规推荐顺位。"
    common_evidence:
      - {source_id: source.cdc_dpdx_clonorchiasis_2024, locator: "Laboratory Diagnosis"}
      - {source_id: source.who_community_diagnosis_clonorchiasis, locator: "Clonorchiasis，网页第88–91行"}
    boundary:
