      - {source_id: source.cdc_dpdx_clonorchiasis_2024, locator: "Life Cycle"}

  - group_id: PCMS-G04
    title: "宿主角色"
    recommendation: "APPROVE_WITH_HOST_CLASS_BOUNDARIES"
    schema_mode: "existing_relations"
    claims:
      - {claim_id: PCMS-020, subject: parasite.clonorchis_sinensis, predicate: has_first_intermediate_host, object: host.freshwater_snails_suitable_for_clonorchis, claim: "适宜淡水螺类是华支睾吸虫的第一中间宿主。"}
      - {claim_id: PCMS-021, subject: parasite.clonorchis_sinensis, predicate: has_second_intermediate_host, object: host.freshwater_fish, claim: "淡水鱼是华支睾吸虫的第二中间宿主，许多种属于鲤科。"}
      - {claim_id: PCMS-022, subject: parasite.clonorchis_sinensis, predicate: has_definitive_host, object: host.human, claim: "人是华支睾吸虫的终宿主。"}
      - {claim_id: PCMS-023, subject: parasite.clonorchis_sinensis, predicate: has_definitive_host, object: host.piscivorous_mammals, claim: "犬科、猫科、猪、鼬科及其他食鱼哺乳动物可作为终宿主。"}
      - {claim_id: PCMS-024, subject: parasite.clonorchis_sinensis, predicate: has_reservoir_host, object: host.domestic_dogs_cats_pigs, claim: "犬、猫和猪可作为保虫宿主。"}
