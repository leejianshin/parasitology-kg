candidate_groups:
  - group_id: PCMS-G01
    title: "成虫与虫卵形态"
    recommendation: "APPROVE_AS_NARRATIVE_FACTS"
    schema_mode: "structured_narrative"
    claims:
      - claim_id: PCMS-001
        claim: "华支睾吸虫成虫背腹扁平，呈狭长或披针形。"
        claim_role: narrative_fact
        evidence:
          - {source_id: source.pmph_human_parasitology_10e_2024, locator: "印刷页94【形态】"}
          - {source_id: source.cdc_dpdx_clonorchiasis_2024, locator: "Image Gallery—C. sinensis adults"}
      - claim_id: PCMS-002
        claim: "华支睾吸虫成虫大小约为10–25 mm × 3–5 mm。"
        claim_role: narrative_fact
        evidence:
          - {source_id: source.pmph_human_parasitology_10e_2024, locator: "印刷页94【形态】"}
          - {source_id: source.cdc_dpdx_clonorchiasis_2024, locator: "Life Cycle; Image Gallery—C. sinensis adults"}
      - claim_id: PCMS-003
        claim: "第10版教材记载华支睾吸虫虫卵约为27–35 μm × 12–20 μm；CDC形态页宽度口径为11–20 μm。"
        claim_role: narrative_fact
        evidence:
          - {source_id: source.pmph_human_parasitology_10e_2024, locator: "印刷页94【形态】"}
          - {source_id: source.cdc_dpdx_clonorchiasis_2024, locator: "Image Gallery—Clonorchis sinensis eggs"}
        qualifier: "正式教学正文采用教材12–20 μm，并在证据注释保留CDC 11–20 μm。"
      - claim_id: PCMS-004
        claim: "华支睾吸虫虫卵较窄端有卵盖及肩峰样结构。"
        claim_role: narrative_fact
        evidence:
          - {source_id: source.pmph_human_parasitology_10e_2024, locator: "印刷页94【形态】"}
          - {source_id: source.cdc_dpdx_clonorchiasis_2024, locator: "Image Gallery—Clonorchis sinensis eggs"}
      - claim_id: PCMS-005
        claim: "华支睾吸虫虫卵无盖端常可见小疣或小突起。"
        claim_role: narrative_fact
        evidence:
          - {source_id: source.pmph_human_parasitology_10e_2024, locator: "印刷页94【形态】"}
          - {source_id: source.cdc_dpdx_clonorchiasis_2024, locator: "Image Gallery—Clonorchis sinensis eggs"}
      - claim_id: PCMS-006
        claim: "排出的华支睾吸虫虫卵内可见已发育的毛蚴。"
        claim_role: narrative_fact
        evidence:
          - {source_id: source.pmph_human_parasitology_10e_2024, locator: "印刷页94【形态】"}
          - {source_id: source.cdc_dpdx_clonorchiasis_2024, locator: "Life Cycle; Image Gallery—Clonorchis sinensis eggs"}
    boundary: "“人体蠕虫卵中最小”暂不作为跨物种绝对排序写入正式关系。"

  - group_id: PCMS-G02
