    boundary:
      - "不得把阿苯达唑写成WHO当前推荐药物。"
      - "三苯双脒不进入本最低集；需另行完成指南地位和适应证核查。"
      - "学生材料不提供个体化处方建议。"

  - group_id: PCMS-G08
    title: "IARC致癌危害分类与个体风险边界"
    recommendation: "APPROVE_WITH_NEW_CLASSIFICATION_MODEL"
    schema_mode: "new_entity_type_and_relation"
    claims:
      - {claim_id: PCMS-032, subject: disease.clonorchiasis, predicate: classified_as, object: hazard.iarc_group_1_carcinogenic_to_humans, claim: "IARC将华支睾吸虫感染列为Group 1（对人类致癌）。"}
    evidence:
      - {source_id: source.iarc_clonorchis_group1, locator: "Clonorchis sinensis (infection with), Group 1, Volumes 61 and 100B"}
    mandatory_narrative_boundary:
      - "分类对象是infection with Clonorchis sinensis，不是单独的虫体名称。"
      - "Group 1属于致癌危害识别，不给出某个感染者的发病概率。"
      - "不得生成“感染者必然发生胆管癌”的表述。"

  - group_id: PCMS-G09
    title: "One Health传播闭环最小机制"
    recommendation: "APPROVE_WITH_MECHANISM_NOT_EFFECT_BOUNDARY"
    schema_mode: "three_new_relations_one_existing_relation"
    claims:
      - {claim_id: PCMS-033, subject: host.human, predicate: sheds_stage, object: stage.clonorchis_egg, claim: "感染者可经粪便排出华支睾吸虫卵。"}
      - {claim_id: PCMS-034, subject: host.domestic_dogs_cats_pigs, predicate: sheds_stage, object: stage.clonorchis_egg, claim: "感染犬、猫和猪可经粪便排出华支睾吸虫卵。"}
      - {claim_id: PCMS-035, subject: stage.clonorchis_egg, predicate: present_in_environment, object: environment.freshwater_environment, claim: "随粪便进入淡水环境的虫卵可进入华支睾吸虫生活史。"}
      - {claim_id: PCMS-036, subject: disease.clonorchiasis, predicate: controlled_by, object: intervention.one_health_integrated_control, claim: "WHO建议以连接人类、动物和环境的综合方法防控食源性吸虫病。"}
    evidence:
      - {source_id: source.cdc_dpdx_clonorchiasis_2024, locator: "Life Cycle"}
      - {source_id: source.who_clonorchiasis_qa_2025, locator: "网页第83–117行，尤其第94–96、116–117行"}
      - {source_id: source.who_foodborne_trematode_fact_sheet, locator: "Treatment, prevention and control"}
    boundary:
      - "只表达传播机制和WHO建议，不声称某一组合在本校或某地区已测得效果。"
      - "闭环必须通过宿主、虫卵、淡水环境、螺、鱼和食物暴露逐段构建，不得以一个抽象箭头替代。"

