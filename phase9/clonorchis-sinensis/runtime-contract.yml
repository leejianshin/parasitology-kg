contract_version: "1.1"
contract_id: "clonorchis_p9a_controlled_rag_v1"
status: "P9A_REVISED_PENDING_REREVIEW"
language: "zh-CN"

authority:
  knowledge_version: "clonorchis_pcms_v1"
  source_commit: "9a9ff5a17de0fc6d32595730f10dfbebd55d9897"
  canonical_input_sha256: "3e83162b75bc0bfcf40b7fd67eba13c610d7050f9bc77f64baa008d664e4411f"
  runtime_bundle_manifest:
    path: "phase9/clonorchis-sinensis/runtime-bundle-manifest.yml"
    sha256: "67a57cc7791006c277e778a518d0c12f30aaf8ee9849fdef46932e412feb3ca8"
    bundle_sha256: "868abdbb5c619d87397167ebaeefe1b1d243a8124acf41e60114bda777187302"
    startup_verification: "REQUIRED_BEFORE_ANY_RETRIEVAL"
  expected_counts:
    entities: 31
    relation_claims: 40
    narrative_claims: 6
  allowed_runtime_inputs:
    - "derived/clonorchis-sinensis/pcms-v1/nodes.jsonl"
    - "derived/clonorchis-sinensis/pcms-v1/edges.jsonl"
    - "phase7/clonorchis-sinensis/pilot-content-minimum-set-authority-review.yml"
    - "sources/registry.yml"
  prohibited_runtime_inputs:
    - "candidate_material"
    - "raw_teacher_workbooks"
    - "learning_platform_generated_content"
    - "student_rosters_or_responses"
    - "external_web"
    - "model_memory"

execution:
  retrieval_mode: "ALLOWLIST_ONLY"
  web_access: "DISABLED"
  external_memory: "DISABLED"
  generation_temperature_policy: "IMPLEMENTATION_MUST_FREEZE"
  one_request_one_audit_record: true
  runtime_must_verify_authority_hash_before_serving: true
  unverified_runtime_state: "REFUSE_TO_SERVE"
  schema_validation_required_before_semantic_validation: true
  semantic_post_validation_required_before_serving: true

claim_admission:
  admitted_status: "reviewed"
  allowed_claim_namespaces:
    - "W2-ATOM-"
    - "PCMS-"
  narrative_claim_range: "PCMS-001..PCMS-006"
  relation_claim_sources:
    - "derived/clonorchis-sinensis/pcms-v1/edges.jsonl"
  narrative_claim_source:
    "phase7/clonorchis-sinensis/pilot-content-minimum-set-authority-review.yml"
  every_claim_requires_registered_source: true
  every_claim_requires_locator: true
  retrieved_but_not_admitted: "EXCLUDE"

disposition_policy:
  allowed:
    - "ANSWER"
    - "PARTIAL"
    - "ABSTAIN"
  ANSWER:
    condition: "All material claims and required qualifiers are fully covered."
    citations_minimum: 1
    coverage_gaps: "MUST_BE_EMPTY"
  PARTIAL:
    condition: "At least one useful admitted claim is covered but the requested conclusion is not fully covered."
    citations_minimum: 1
    coverage_gaps: "REQUIRED"
  ABSTAIN:
    condition: "No safe admitted answer can be formed or a hard gate fails."
    citations_minimum: 0
    coverage_gaps: "REQUIRED"
    must_not_state_uncovered_medical_conclusion: true

student_visible_provenance:
  hard_gate: true
  backend_trace_is_not_sufficient: true
  each_material_claim_must_show:
    - "claim_id"
    - "source_id"
    - "source_label"
    - "locator"
  unresolved_or_hidden_citation: "ABSTAIN"

required_qualifier_controls:
  - claim_id: "PCMS-029"
    required:
      jurisdiction: "China"
      routine_first_choice: false
      operational_note: "complex_sampling"
  - claim_id: "PCMS-030"
    required:
      authority: "WHO"
      recommendation_role: "recommended"
  - claim_id: "PCMS-031"
    required:
      authority: "US_CDC"
      recommendation_role: "alternative"
  - claim_id: "PCMS-032"
    required:
      hazard_not_individual_probability: true
      individual_cancer_certainty: false
  - claim_id: "PCMS-035"
    required:
      direct_human_infectivity: false
  - claim_id: "PCMS-036"
    required:
      universal_elimination_claim: false

semantic_boundaries:
  diagnostic_clue_is_not_confirmation: true
  exposure_is_not_confirmation: true
  imaging_is_not_confirmation: true
  association_is_not_causality: true
  recommendation_is_not_quantified_effect: true
  hazard_class_is_not_individual_certainty: true
  missing_coverage_must_not_be_filled_from_model_knowledge: true

hard_fail_conditions:
  - "AUTHORITY_BUNDLE_MISMATCH"
  - "NO_SAFE_ADMITTED_ANSWER"
  - "UNREGISTERED_SOURCE"
  - "UNKNOWN_ENTITY_ID"
  - "UNKNOWN_CLAIM_ID"
  - "UNREVIEWED_CLAIM"
  - "MISSING_REQUIRED_QUALIFIER"
  - "HIDDEN_STUDENT_CITATION"
  - "CITATION_CLAIM_MISMATCH"
  - "CITATION_LOCATOR_MISMATCH"
  - "DIAGNOSTIC_CLUE_PROMOTED_TO_CONFIRMATION"
  - "ASSOCIATION_PROMOTED_TO_CAUSALITY"
  - "MODEL_MEMORY_GAP_FILL"
  - "EXTERNAL_WEB_GAP_FILL"
  - "STUDENT_DATA_IN_PUBLIC_ARTIFACT"

determinism:
  same_request_and_authority_must_preserve:
    - "disposition"
    - "material_claim_ids"
    - "core_source_ids"
  repeated_run_count_for_acceptance: 3
  stylistic_variation_allowed: true
  factual_or_provenance_drift_allowed: false
