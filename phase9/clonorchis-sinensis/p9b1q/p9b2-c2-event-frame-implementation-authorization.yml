    Deterministically compile one validated S1 Clause AST into one validated
    S2 Event Frame object under the corrected frozen authority.
  allowed_stages:
    - "S0_REQUEST_NORMALIZATION"
    - "S1_CLAUSE_AST"
    - "S2_EVENT_FRAME"
  terminal_output: "VALIDATED_EVENT_FRAME"
  prohibited_stages:
    - "S3_TYPED_CONSTRAINT_SOLVER"
    - "S4_QUERYIR_EMISSION_IMPLEMENTATION"
    - "S5_RUNTIME_RETRIEVAL_BINDING"
  retrieval: "PROHIBITED"
  model_or_network_call: "PROHIBITED"

