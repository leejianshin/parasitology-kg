    - "NEGATED"
    - "EXCLUDED"
    - "HYPOTHETICAL"
    - "historical and current separation"
  reference_and_override:
    - "unique reference hypothesis"
    - "unresolved reference preserves all candidates"
    - "override UNIQUE"
    - "override UNRESOLVED"
    - "override NO_MATCH"
  regression:
