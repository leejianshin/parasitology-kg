    COMPETING: "PRESERVE_ALL_LEGAL_CANDIDATES"
    INCOMPLETE: "ONLY_AS_DEFINED_BY_SCHEMA_AND_AUTHORITY"
  s3_invoked: false

assertion_and_temporal_binding:
  source: "VALIDATED_AST_SCOPE_PATH"
  required_fields:
    - "assertion_status"
    - "finding_polarity"
    - "temporal_scope"
    - "governing_ast_node_ids"
    - "marker_ids"
