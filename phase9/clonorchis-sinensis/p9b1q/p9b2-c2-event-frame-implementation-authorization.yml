    - "current frozen event ontology"
    - "current frozen event mapping"
    - "public S0, S1, and S2 fixtures"
  access_mode: "READ_ONLY"
  authority_mutation_to_accommodate_implementation: "PROHIBITED"

c2_required_output_structure:
  top_level_collections:
    - "frames"
    - "specimen_slots"
    - "reference_hypotheses"
    - "override_hypotheses"
  required_frame_fields:
    - "frame_id"
    - "event_type_domain"
    - "source_ast_node_ids"
    - "source_spans"
    - "participant_slots"
    - "assertion"
    - "diagnostic_binding"
    - "normalized_identity"
    - "frame_status"

event_type_and_participant_domain_rules:
  derivation_inputs:
    - "validated Clause AST"
    - "frozen entity ontology"
    - "frozen event ontology"
    - "frozen event mapping"
  lexical_heuristic_event_type_guessing: "PROHIBITED"
  ast_unlicensed_entity_addition: "PROHIBITED"
  claim_or_retrieval_driven_event_typing: "PROHIBITED"
  competing_candidate_winner_selection: "PROHIBITED"
  binding_status_rules:
