  diagnostic_binding:
    - "method, specimen, target and polarity bind to one event"
    - "two diagnostic events do not cross-bind method or specimen"
    - "negative diagnostic finding does not imply infection exclusion"
    - "non-diagnostic frame has diagnostic_binding null"
  identity:
    - "same-event pair"
    - "distinct-event pair"
    - "method difference changes identity"
    - "specimen difference changes identity"
    - "target difference changes identity"
    - "anatomical-site difference changes identity"
    - "frame_id does not alter identity"
  assertion_and_temporal:
