    - "ACTOR_ENTITY_IDS"
    - "METHOD_ENTITY_ID"
    - "SPECIMEN_CODE"
    - "TARGET_ENTITY_IDS"
    - "ANATOMICAL_SITE_ENTITY_IDS"
  temporal_scope_domain_binding: "AS_DEFINED_BY_EVENT_FRAME_AUTHORITY"
  same_event: "ALL_NORMALIZED_IDENTITY_DIMENSIONS_EQUAL"
  distinct_event: "AT_LEAST_ONE_NORMALIZED_IDENTITY_DIMENSION_DIFFERS"
  prohibited_semantic_identity_shortcuts:
