    - "specimen"
    - "target"
    - "finding_polarity"
    - "assertion"
  cross_event_binding: "PROHIBITED"
  diagnostic_binding_must_match_schema_and_formal_mapping: true
  non_diagnostic_binding: null

specimen_governance:
