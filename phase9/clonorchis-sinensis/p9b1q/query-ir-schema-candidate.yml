$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/parasitology-kg/phase9/p9b1q/query-ir-schema-candidate-v0.2"
title: "P9-B1Q scoped query interpretation candidate"
description: >-
  Candidate only. This object interprets request text into scoped clauses,
  mentions, events, roles, formal relation intents, and controlled narrative
  intents. It must never contain
  claim IDs, citations, source IDs, locators, or answer text.
type: object
additionalProperties: false
required:
  - query_ir_version
  - request_id
  - request_sha256
  - knowledge_version
  - span_basis
  - interpretation_status
  - producer
  - clauses
  - mentions
  - events
  - relation_intents
  - narrative_intents
  - required_roles
  - forbidden_relation_intents
  - resolved_references
  - resolved_overrides
  - ambiguities
properties:
  query_ir_version:
    const: "0.2-candidate"
  request_id:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
  request_sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  knowledge_version:
    const: "clonorchis_pcms_v1"
  span_basis:
    const: "REQUEST_QUERY_TEXT_UNICODE_CODEPOINT_ZERO_BASED_HALF_OPEN"
  interpretation_status:
    enum: [VALID, AMBIGUOUS, UNSUPPORTED]
  producer:
    type: object
    additionalProperties: false
    required:
      - producer_id
      - producer_version
      - implementation_kind
      - configuration_sha256
    properties:
      producer_id:
        type: string
        minLength: 1
        maxLength: 128
      producer_version:
        type: string
        minLength: 1
        maxLength: 64
      implementation_kind:
        enum: [DETERMINISTIC, CONSTRAINED_MODEL, HYBRID]
      configuration_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
  clauses:
    type: array
    minItems: 1
    maxItems: 64
    uniqueItems: true
    items:
      $ref: "#/$defs/clause"
  mentions:
    type: array
    maxItems: 128
    uniqueItems: true
    items:
      $ref: "#/$defs/mention"
  events:
    type: array
    maxItems: 128
    uniqueItems: true
    items:
      $ref: "#/$defs/event"
  relation_intents:
    type: array
    maxItems: 128
    uniqueItems: true
    items:
      $ref: "#/$defs/relation_intent"
  narrative_intents:
    type: array
    maxItems: 64
    uniqueItems: true
    items:
      $ref: "#/$defs/narrative_intent"
  required_roles:
    type: array
    maxItems: 64
    uniqueItems: true
    items:
      $ref: "#/$defs/required_role"
  forbidden_relation_intents:
    type: array
    maxItems: 128
    uniqueItems: true
    items:
      $ref: "#/$defs/forbidden_relation_intent"
  resolved_references:
    type: array
    maxItems: 64
    uniqueItems: true
    items:
      $ref: "#/$defs/resolved_reference"
  resolved_overrides:
    type: array
    maxItems: 32
    uniqueItems: true
    items:
      $ref: "#/$defs/resolved_override"
  ambiguities:
    type: array
    maxItems: 64
    uniqueItems: true
    items:
      $ref: "#/$defs/ambiguity"
allOf:
  - if:
      properties:
        interpretation_status: {const: VALID}
    then:
      properties:
        ambiguities: {type: array, maxItems: 0}
      anyOf:
        - properties:
            relation_intents: {type: array, minItems: 1}
        - properties:
            narrative_intents: {type: array, minItems: 1}
  - if:
      properties:
        interpretation_status: {enum: [AMBIGUOUS, UNSUPPORTED]}
    then:
      properties:
        ambiguities: {type: array, minItems: 1}
$defs:
  source_span:
    type: object
    additionalProperties: false
    required: [start_char, end_char, text]
    properties:
      start_char: {type: integer, minimum: 0, maximum: 2000}
      end_char: {type: integer, minimum: 1, maximum: 2000}
      text: {type: string, minLength: 1, maxLength: 2000}
  assertion_status:
    enum: [AFFIRMED, NEGATED, EXCLUDED, HYPOTHETICAL, UNKNOWN]
  temporal_scope:
    enum: [HISTORICAL, CURRENT, FUTURE, GENERAL, UNKNOWN]
  entity_type:
    enum:
      - parasite
      - life_cycle_stage
      - host
      - disease
      - anatomical_site
      - pathological_process
      - clinical_manifestation
      - diagnostic_method
      - treatment
      - intervention
      - behavior
      - environment
      - institution_policy
      - hazard_classification
  predicate:
    enum:
      - has_life_cycle_stage
      - develops_into
      - has_definitive_host
      - has_first_intermediate_host
      - has_second_intermediate_host
      - has_paratenic_host
      - has_reservoir_host
      - has_vector
      - infective_stage_for
      - pathogenic_stage_for
      - diagnostic_stage_for
      - infects
      - parasitizes_site
      - causes
      - has_pathological_process
      - occurs_in
      - manifests_as
      - has_complication
      - epidemiologically_associated_with
      - diagnosed_by
      - classified_as
      - has_diagnostic_clue
      - treated_by
      - transmitted_via
      - transmission_supported_by
      - risk_increased_by
      - controlled_by
      - sheds_stage
      - present_in_environment
      - targets
  topic_scope:
    enum:
      - morphology
      - diagnosis
      - life_cycle
      - transmission
      - host_roles
      - one_health
      - exposure
      - control
      - boundary
      - treatment
      - carcinogenicity
      - stage_roles
      - source_traceability
  selector:
    type: object
    additionalProperties: false
    required: [entity_ids, entity_types]
    properties:
      entity_ids:
        type: array
        maxItems: 16
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
      entity_types:
        type: array
        maxItems: 14
        uniqueItems: true
        items:
          $ref: "#/$defs/entity_type"
    anyOf:
      - properties:
          entity_ids: {type: array, minItems: 1}
      - properties:
          entity_types: {type: array, minItems: 1}
  clause:
    type: object
    additionalProperties: false
    required:
      - clause_id
      - order
      - source_span
      - discourse_operator
      - parent_clause_id
      - alternative_group_id
    properties:
      clause_id:
        type: string
        pattern: "^C[0-9]{2,3}$"
      order: {type: integer, minimum: 1, maximum: 64}
      source_span: {$ref: "#/$defs/source_span"}
      discourse_operator:
        enum: [ROOT, AND, OR, CONTRAST, OVERRIDE, CONDITION]
      parent_clause_id:
        oneOf:
          - {type: string, pattern: "^C[0-9]{2,3}$"}
          - {type: "null"}
      alternative_group_id:
        oneOf:
          - {type: string, pattern: "^ALT[0-9]{2,3}$"}
          - {type: "null"}
    allOf:
      - if:
          properties:
            discourse_operator: {const: ROOT}
        then:
          properties:
            parent_clause_id: {type: "null"}
            alternative_group_id: {type: "null"}
        else:
          properties:
            parent_clause_id: {type: string, pattern: "^C[0-9]{2,3}$"}
      - if:
          properties:
            discourse_operator: {const: OR}
        then:
          properties:
            alternative_group_id: {type: string, pattern: "^ALT[0-9]{2,3}$"}
        else:
          properties:
            alternative_group_id: {type: "null"}
  mention:
    type: object
    additionalProperties: false
    required:
      - mention_id
      - clause_id
      - source_span
      - entity_id
      - entity_type
      - assertion_status
      - temporal_scope
      - reference_ids
    properties:
      mention_id:
        type: string
        pattern: "^M[0-9]{2,3}$"
      clause_id:
        type: string
        pattern: "^C[0-9]{2,3}$"
      source_span: {$ref: "#/$defs/source_span"}
      entity_id:
        type: string
        pattern: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
      entity_type: {$ref: "#/$defs/entity_type"}
      assertion_status: {$ref: "#/$defs/assertion_status"}
      temporal_scope: {$ref: "#/$defs/temporal_scope"}
      reference_ids:
        type: array
        maxItems: 8
        uniqueItems: true
        items: {type: string, pattern: "^REF[0-9]{2,3}$"}
  event:
    type: object
    additionalProperties: false
    required:
      - event_id
      - clause_id
      - source_span
      - event_type
      - assertion_status
      - temporal_scope
      - actor_entity_ids
      - method_entity_id
      - specimen_code
      - target_entity_id
      - finding_polarity
      - mention_ids
      - reference_ids
    properties:
      event_id:
        type: string
        pattern: "^E[0-9]{2,3}$"
      clause_id:
        type: string
        pattern: "^C[0-9]{2,3}$"
      source_span: {$ref: "#/$defs/source_span"}
      event_type:
        enum:
          - DIAGNOSTIC_FINDING
          - EXPOSURE
          - DEVELOPMENT
          - HOST_ROLE
          - INGESTION
          - SHEDDING
          - ENVIRONMENT_PRESENCE
          - INFECTION
          - PARASITISM
          - PATHOLOGICAL_PROCESS
          - TREATMENT
          - CONTROL
          - HAZARD_CLASSIFICATION
          - SOURCE_TRACEABILITY
      assertion_status: {$ref: "#/$defs/assertion_status"}
      temporal_scope: {$ref: "#/$defs/temporal_scope"}
      actor_entity_ids:
        type: array
        maxItems: 16
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
      method_entity_id:
        oneOf:
          - type: string
            pattern: "^diagnostic\\.[a-z0-9][a-z0-9_]*$"
          - {type: "null"}
      specimen_code:
        enum: [STOOL, DUODENAL_FLUID, NOT_APPLICABLE, UNSPECIFIED]
      target_entity_id:
        oneOf:
          - type: string
            pattern: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
          - {type: "null"}
      finding_polarity:
        enum: [POSITIVE, NEGATIVE, UNSPECIFIED, NOT_APPLICABLE]
      mention_ids:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items:
          type: string
          pattern: "^M[0-9]{2,3}$"
      reference_ids:
        type: array
        maxItems: 8
        uniqueItems: true
        items: {type: string, pattern: "^REF[0-9]{2,3}$"}
    allOf:
      - if:
          properties:
            event_type: {const: DIAGNOSTIC_FINDING}
        then:
          properties:
            method_entity_id:
              type: string
              pattern: "^diagnostic\\.[a-z0-9][a-z0-9_]*$"
            specimen_code:
              enum: [STOOL, DUODENAL_FLUID, NOT_APPLICABLE, UNSPECIFIED]
            finding_polarity:
              enum: [POSITIVE, NEGATIVE, UNSPECIFIED]
        else:
          properties:
            method_entity_id: {type: "null"}
            specimen_code: {const: NOT_APPLICABLE}
            finding_polarity: {const: NOT_APPLICABLE}
      - if:
          properties:
            method_entity_id: {const: diagnostic.stool_egg_microscopy}
        then:
          properties:
            specimen_code: {const: STOOL}
      - if:
          properties:
            method_entity_id: {const: diagnostic.duodenal_fluid_egg_microscopy}
        then:
          properties:
            specimen_code: {const: DUODENAL_FLUID}
      - if:
          properties:
            method_entity_id: {const: diagnostic.biliary_imaging}
        then:
          properties:
            specimen_code: {const: NOT_APPLICABLE}
  relation_intent:
    type: object
    additionalProperties: false
    required:
      - intent_id
      - clause_ids
      - source_spans
      - predicate
      - subject_selector
      - object_selector
      - assertion_status
      - temporal_scope
      - activation_policy
      - basis_ids
    properties:
      intent_id:
        type: string
        pattern: "^R[0-9]{2,3}$"
      clause_ids:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, pattern: "^C[0-9]{2,3}$"}
      source_spans:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/source_span"}
      predicate: {$ref: "#/$defs/predicate"}
      subject_selector: {$ref: "#/$defs/selector"}
      object_selector: {$ref: "#/$defs/selector"}
      assertion_status: {const: AFFIRMED}
      temporal_scope: {$ref: "#/$defs/temporal_scope"}
      activation_policy:
        enum: [REQUIRED, OPTIONAL_CONTEXT, REQUIRED_CONTRAST]
      basis_ids:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items:
          type: string
          pattern: "^(M|E)[0-9]{2,3}$"
  narrative_intent:
    type: object
    additionalProperties: false
    required:
      - narrative_intent_id
      - clause_ids
      - source_spans
      - entity_selector
      - topic_scope
      - semantic_role
      - assertion_status
      - temporal_scope
      - activation_policy
      - basis_ids
      - required_anchor_predicates
    properties:
      narrative_intent_id:
        type: string
        pattern: "^N[0-9]{2,3}$"
      clause_ids:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, pattern: "^C[0-9]{2,3}$"}
      source_spans:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/source_span"}
      entity_selector: {$ref: "#/$defs/selector"}
      topic_scope: {$ref: "#/$defs/topic_scope"}
      semantic_role:
        enum:
          - narrative_fact
          - diagnostic_evidence_integration
          - diagnostic_confirmation_limit
      assertion_status: {const: AFFIRMED}
      temporal_scope: {$ref: "#/$defs/temporal_scope"}
      activation_policy:
        enum: [REQUIRED, OPTIONAL_CONTEXT, REQUIRED_CONTRAST]
      basis_ids:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items:
          type: string
          pattern: "^(M|E)[0-9]{2,3}$"
      required_anchor_predicates:
        type: array
        maxItems: 8
        uniqueItems: true
        items: {$ref: "#/$defs/predicate"}
  required_role:
    type: object
    additionalProperties: false
    required:
      - role_id
      - clause_ids
      - role_namespace
      - role_value
      - activation_policy
      - basis_ids
    properties:
      role_id: {type: string, pattern: "^Q[0-9]{2,3}$"}
      clause_ids:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, pattern: "^C[0-9]{2,3}$"}
      role_namespace:
        enum: [TOPIC_SCOPE, EVIDENCE_ROLE, SEMANTIC_BOUNDARY, CONTROL_ROLE]
      role_value:
        type: string
        minLength: 1
        maxLength: 128
      activation_policy:
        enum: [REQUIRED, REQUIRED_CONTRAST]
      basis_ids:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items:
          type: string
          pattern: "^(M|E|R|N)[0-9]{2,3}$"
    allOf:
      - if:
          properties:
            role_namespace: {const: TOPIC_SCOPE}
        then:
          properties:
            role_value: {$ref: "#/$defs/topic_scope"}
      - if:
          properties:
            role_namespace: {const: EVIDENCE_ROLE}
        then:
          properties:
            role_value:
              enum:
                - epidemiologic_exposure_clue
                - imaging_auxiliary_clue
                - pathogen_confirmation
      - if:
          properties:
            role_namespace: {const: SEMANTIC_BOUNDARY}
        then:
          properties:
            role_value:
              enum:
                - diagnostic_clue_is_not_confirmation
                - exposure_is_not_confirmation
                - imaging_is_not_confirmation
                - association_is_not_causality
                - recommendation_is_not_quantified_effect
                - hazard_class_is_not_individual_certainty
                - missing_coverage_must_not_be_filled_from_model_knowledge
                - diagnostic_evidence_integration
                - diagnostic_confirmation_limit
                - evidence_integration_required
                - pathogen_evidence_required_for_confirmation
                - cannot_confirm_alone
                - not_confirmatory
      - if:
          properties:
            role_namespace: {const: CONTROL_ROLE}
        then:
          properties:
            role_value:
              enum:
                - recommendation_not_local_effect
                - recommendation_not_quantified_effect
                - universal_elimination_claim_false
                - mechanism_and_recommendation
                - interrupt_egg_entry_to_intermediate_host_waters
  forbidden_relation_intent:
    type: object
    additionalProperties: false
    required:
      - prohibition_id
      - clause_ids
      - source_spans
      - predicate
      - subject_selector
      - object_selector
      - reason
      - basis_ids
    properties:
      prohibition_id: {type: string, pattern: "^F[0-9]{2,3}$"}
      clause_ids:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, pattern: "^C[0-9]{2,3}$"}
      source_spans:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/source_span"}
      predicate: {$ref: "#/$defs/predicate"}
      subject_selector: {$ref: "#/$defs/selector"}
      object_selector: {$ref: "#/$defs/selector"}
      reason:
        enum:
          - EXPLICIT_NEGATION
          - EXPLICIT_EXCLUSION
          - HYPOTHETICAL_ONLY
          - TEMPORAL_MISMATCH
      basis_ids:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items:
          type: string
          pattern: "^(M|E)[0-9]{2,3}$"
  resolved_reference:
    type: object
    additionalProperties: false
    required:
      - reference_id
      - clause_id
      - anaphor_span
      - referent_kind
      - referent_id
      - resolution_status
    properties:
      reference_id: {type: string, pattern: "^REF[0-9]{2,3}$"}
      clause_id: {type: string, pattern: "^C[0-9]{2,3}$"}
      anaphor_span: {$ref: "#/$defs/source_span"}
      referent_kind:
        enum: [CLAUSE, MENTION, EVENT]
      referent_id:
        type: string
        pattern: "^(C|M|E)[0-9]{2,3}$"
      resolution_status: {const: RESOLVED}
  resolved_override:
    type: object
    additionalProperties: false
    required:
      - override_id
      - override_clause_id
      - earlier_event_id
      - later_event_id
      - same_normalized_event_identity
      - resolution_status
    properties:
      override_id: {type: string, pattern: "^OVR[0-9]{2,3}$"}
      override_clause_id: {type: string, pattern: "^C[0-9]{2,3}$"}
      earlier_event_id: {type: string, pattern: "^E[0-9]{2,3}$"}
      later_event_id: {type: string, pattern: "^E[0-9]{2,3}$"}
      same_normalized_event_identity: {const: true}
      resolution_status: {const: RESOLVED}
  ambiguity:
    type: object
    additionalProperties: false
    required:
      - ambiguity_id
      - ambiguity_type
      - source_spans
      - affected_ids
      - candidate_options
      - resolution_status
    properties:
      ambiguity_id: {type: string, pattern: "^A[0-9]{2,3}$"}
      ambiguity_type:
        enum:
          - ENTITY_RESOLUTION
          - CLAUSE_ATTACHMENT
          - NEGATION_SCOPE
          - COORDINATION_SCOPE
          - METHOD_SPECIMEN_BINDING
          - FINDING_POLARITY
          - TEMPORAL_SCOPE
          - REFERENCE_RESOLUTION
          - RELATION_DIRECTION
          - DISCOURSE_OVERRIDE
          - OR_SELECTION
          - UNSUPPORTED_INTENT
      source_spans:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/source_span"}
      affected_ids:
        type: array
        maxItems: 32
        uniqueItems: true
        items:
          type: string
          pattern: "^(C|M|E|R|N|Q|F|REF|OVR)[0-9]{2,3}$"
      candidate_options:
        type: array
        minItems: 1
        maxItems: 8
        uniqueItems: true
        items: {$ref: "#/$defs/ambiguity_option"}
      resolution_status:
        const: UNRESOLVED
    allOf:
      - if:
          properties: {ambiguity_type: {const: ENTITY_RESOLUTION}}
        then:
          properties:
            candidate_options:
              type: array
              items:
                allOf:
                  - {$ref: "#/$defs/ambiguity_option"}
                  - type: object
                    properties: {option_kind: {const: ENTITY}}
      - if:
          properties: {ambiguity_type: {const: CLAUSE_ATTACHMENT}}
        then:
          properties:
            candidate_options:
              type: array
              items:
                allOf:
                  - {$ref: "#/$defs/ambiguity_option"}
                  - type: object
                    properties: {option_kind: {const: PARENT_CLAUSE}}
      - if:
          properties: {ambiguity_type: {const: NEGATION_SCOPE}}
        then:
          properties:
            candidate_options:
              type: array
              items:
                allOf:
                  - {$ref: "#/$defs/ambiguity_option"}
                  - type: object
                    properties: {option_kind: {const: ASSERTION_STATUS}}
      - if:
          properties: {ambiguity_type: {const: COORDINATION_SCOPE}}
        then:
          properties:
            candidate_options:
              type: array
              items:
                allOf:
                  - {$ref: "#/$defs/ambiguity_option"}
                  - type: object
                    properties: {option_kind: {enum: [METHOD_SPECIMEN, DIRECTED_RELATION]}}
      - if:
          properties: {ambiguity_type: {const: METHOD_SPECIMEN_BINDING}}
        then:
          properties:
            candidate_options:
              type: array
              items:
                allOf:
                  - {$ref: "#/$defs/ambiguity_option"}
                  - type: object
                    properties: {option_kind: {const: METHOD_SPECIMEN}}
      - if:
          properties: {ambiguity_type: {const: FINDING_POLARITY}}
        then:
          properties:
            candidate_options:
              type: array
              items:
                allOf:
                  - {$ref: "#/$defs/ambiguity_option"}
                  - type: object
                    properties: {option_kind: {const: FINDING_POLARITY}}
      - if:
          properties: {ambiguity_type: {const: TEMPORAL_SCOPE}}
        then:
          properties:
            candidate_options:
              type: array
              items:
                allOf:
                  - {$ref: "#/$defs/ambiguity_option"}
                  - type: object
                    properties: {option_kind: {const: TEMPORAL_SCOPE}}
      - if:
          properties: {ambiguity_type: {const: REFERENCE_RESOLUTION}}
        then:
          properties:
            candidate_options:
              type: array
              items:
                allOf:
                  - {$ref: "#/$defs/ambiguity_option"}
                  - type: object
                    properties: {option_kind: {const: REFERENT}}
      - if:
          properties: {ambiguity_type: {const: RELATION_DIRECTION}}
        then:
          properties:
            candidate_options:
              type: array
              items:
                allOf:
                  - {$ref: "#/$defs/ambiguity_option"}
                  - type: object
                    properties: {option_kind: {const: DIRECTED_RELATION}}
      - if:
          properties: {ambiguity_type: {const: DISCOURSE_OVERRIDE}}
        then:
          properties:
            candidate_options:
              type: array
              items:
                allOf:
                  - {$ref: "#/$defs/ambiguity_option"}
                  - type: object
