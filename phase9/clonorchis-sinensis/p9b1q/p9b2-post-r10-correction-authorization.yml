authority_reconciliation:
- Current explicit consumed-heldout instruction supersedes older pipeline language permitting private
  R10 diagnostic reruns.
- C5 legacy_helpers clause allows frozen old interpreter/binding helpers; they must not be mistaken for
  integrated C5 or used as its replacement.
- HIGH-008 permits diagnostic UNSPECIFIED representation upstream; QueryIR semantic executability still
  requires its separate diagnostic gate.
- C5 recovery record 188e3c1 explicitly records uncommitted runtime recovery and main not reaching C5.
  Later D1/D2, D3 and D5 scopes do not authorize that recovery.
- No normative conflict exists about rejecting the concrete uncovered material interval. This atom adds
  an S1 admission check using existing C1ValidationError, not a new registry ID or a reassignment of SPAN_ORDER_INVALID.
- Other partial or nonconforming matrix rows are observations, not additional correction authorizations.
conformance_matrix_basis: Public-source code inspection, cited public test inspection and one independently
  constructed local S1/S2 coverage probe; not a new full regression or exhaustive conformance certificate.
