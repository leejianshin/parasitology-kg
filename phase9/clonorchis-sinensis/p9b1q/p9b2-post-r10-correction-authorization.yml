public_test_self_confirmation_evidence:
- Implementation and regression tests were introduced or corrected together in abd8727, 47995c7, f53d618
  and 8aa017d; this is risk evidence, not proof every test is weak.
- validate_c1_clause_ast checks retained spans and shares recognized-operator recognition with producer;
  existing tests do not independently enforce all material codepoint coverage.
- C3 and C4 projection routines both flatten proposition topology; agreement can preserve the same wrong
  interpretation.
- 48-constraint coverage test checks production receipt entries and nonempty site strings rather than
  exercising every formal requirement.
- BindingChainTests uses legacy build_bound_execution, while production CLI is expressly tested to stop
  at C4.
- Existing independent negative mutation, proof replay and C4 oracle correction b50ee95 remain valuable
  and must not be weakened.
- 173/173 is admitted historical regression stability, not independently established semantic conformance;
  full suite was not rerun in this CONTROL.
