predicate_type_matrix:
  has_life_cycle_stage: {subject_types: [parasite], object_types: [life_cycle_stage]}
  develops_into: {subject_types: [life_cycle_stage], object_types: [life_cycle_stage]}
  has_definitive_host: {subject_types: [parasite], object_types: [host]}
  has_first_intermediate_host: {subject_types: [parasite], object_types: [host]}
  has_second_intermediate_host: {subject_types: [parasite], object_types: [host]}
  has_paratenic_host: {subject_types: [parasite], object_types: [host]}
  has_reservoir_host: {subject_types: [parasite], object_types: [host]}
  has_vector: {subject_types: [parasite], object_types: [host]}
  infective_stage_for: {subject_types: [life_cycle_stage], object_types: [host]}
  pathogenic_stage_for: {subject_types: [life_cycle_stage], object_types: [disease]}
  diagnostic_stage_for: {subject_types: [life_cycle_stage], object_types: [host]}
  infects: {subject_types: [parasite], object_types: [host]}
  parasitizes_site: {subject_types: [parasite, life_cycle_stage], object_types: [anatomical_site]}
  causes: {subject_types: [parasite], object_types: [disease]}
  has_pathological_process: {subject_types: [disease], object_types: [pathological_process]}
  occurs_in: {subject_types: [pathological_process], object_types: [anatomical_site]}
  manifests_as: {subject_types: [disease], object_types: [clinical_manifestation]}
  has_complication: {subject_types: [disease], object_types: [disease]}
  epidemiologically_associated_with: {subject_types: [disease], object_types: [disease]}
  diagnosed_by: {subject_types: [disease], object_types: [diagnostic_method]}
  classified_as: {subject_types: [disease], object_types: [hazard_classification]}
  has_diagnostic_clue:
    subject_types: [disease]
    object_types: [behavior, clinical_manifestation, diagnostic_method]
  treated_by: {subject_types: [disease], object_types: [treatment]}
  transmitted_via: {subject_types: [parasite], object_types: [behavior]}
  transmission_supported_by: {subject_types: [parasite], object_types: [environment]}
  risk_increased_by: {subject_types: [disease], object_types: [behavior, environment]}
  controlled_by:
    subject_types: [parasite, disease]
    object_types: [intervention, institution_policy]
  sheds_stage: {subject_types: [host], object_types: [life_cycle_stage]}
  present_in_environment: {subject_types: [life_cycle_stage], object_types: [environment]}
  targets:
    subject_types: [intervention, institution_policy]
    object_types: [host, behavior, environment, diagnostic_method, treatment]

event_field_defaults:
  diagnostic:
    method_entity_id: "REQUIRED_REVIEWED_DIAGNOSTIC_METHOD"
    specimen_code: "METHOD_CONSTRAINED"
    finding_polarity: [POSITIVE, NEGATIVE]
  non_diagnostic:
    method_entity_id: null
    specimen_code: "NOT_APPLICABLE"
    finding_polarity: "NOT_APPLICABLE"
  unresolved_material_field: "AMBIGUOUS_NO_RETRIEVAL"

derivation_source_tokens:
  entity_type_token: >-
    A token equal to a formal entity type resolves only to reviewed entity IDs
    of that type present in event.actor_entity_ids, event.target_entity_id, or
    mentions directly bound by event.mention_ids. It never authorizes another
    entity merely because that entity has the same type.
  method_entity_id: "Exactly event.method_entity_id; null contributes no entity."
  bound_mention_scope: >-
    A bound mention must be in the event clause or a uniquely resolved
    reference-linked clause. Unrelated same-clause or same-type mentions are
    not event participants.
  open_type_selector: >-
    An entity-type-only selector is permitted only when the corresponding
    subject_from/object_from list contains that type and the request explicitly
    asks for an unknown counterpart. It cannot hide an unresolved known entity.
  concrete_selector: >-
    Every concrete selector entity ID must be in the deterministically resolved
    source set for its side. Adding an entity not present in that source set is
    EVENT_INTENT_DERIVATION_MISMATCH.

event_to_relation_derivation:
  applies_when: "relation_intent.derivation_mode == EVENT_DERIVED"
  rules:
    - "each E basis resolves to exactly one event"
    - "relation predicate exists in every material E basis event_mapping[event_type].predicates"
    - "subject selector is derived only from that predicate subject_from tokens"
    - "object selector is derived only from that predicate object_from tokens"
    - "all concrete selector entities occur in the deterministic event source set"
    - "all E bases share the relation intent clause/source-span scope"
    - "an unrelated M basis cannot repair an E-to-predicate mismatch"
  zero_matching_event_predicate: "FAIL_CLOSED"
  selector_contains_unbound_entity: "FAIL_CLOSED"

direct_mention_to_relation_derivation:
  applies_when: "relation_intent.derivation_mode == DIRECT_MENTION_DERIVED"
  rules:
    - "basis contains M IDs only"
    - "every concrete selector entity occurs in an AFFIRMED basis mention"
    - "open entity-type slots follow predicate_type_matrix and are explicitly requested"
    - "predicate and direction are expressed by exact request spans"
  inferred_concrete_entity_not_in_basis: "FAIL_CLOSED"

event_mapping:
  DIAGNOSTIC_FINDING:
    event_class: "DIAGNOSTIC"
    allowed_actor_types: [disease, life_cycle_stage, host]
    allowed_target_types: [life_cycle_stage, pathological_process]
    predicates:
      diagnosed_by: {subject_from: [disease], object_from: [method_entity_id]}
      diagnostic_stage_for: {subject_from: [life_cycle_stage], object_from: [host]}
      has_diagnostic_clue: {subject_from: [disease], object_from: [diagnostic_method]}
    diagnostic_participant_role_catalog:
      diagnosed_by:
        subject:
          source_token: disease
          semantic_role: ACTOR
          materialization: REQUIRED_WHEN_EXPLICITLY_BOUND
          cardinality: EXACTLY_ONCE_PER_CANONICAL_PARTICIPANT
        object:
          source_token: method_entity_id
          semantic_role: METHOD
          materialization: REQUIRED_WHEN_EXPLICITLY_BOUND
          cardinality: EXACTLY_ONE_METHOD_SLOT_PER_EVENT_METHOD_DOMAIN
      diagnostic_stage_for:
        subject:
          source_token: life_cycle_stage
          semantic_role: TARGET
          materialization: REQUIRED_WHEN_EXPLICITLY_BOUND
          cardinality: EXACTLY_ONCE_PER_CANONICAL_PARTICIPANT
        object:
          source_token: host
          semantic_role: ACTOR
          materialization: REQUIRED_WHEN_EXPLICITLY_BOUND
          cardinality: EXACTLY_ONCE_PER_CANONICAL_PARTICIPANT
      has_diagnostic_clue:
        subject:
          source_token: disease
          semantic_role: ACTOR
          materialization: REQUIRED_WHEN_EXPLICITLY_BOUND
          cardinality: EXACTLY_ONCE_PER_CANONICAL_PARTICIPANT
        object:
          source_token: diagnostic_method
          semantic_role: METHOD
          materialization: REQUIRED_WHEN_EXPLICITLY_BOUND
          cardinality: EXACTLY_ONE_METHOD_SLOT_PER_EVENT_METHOD_DOMAIN
    diagnostic_role_materialization:
      expressed_predicates: "RECOMPUTE_FROM_ACTUAL_PROPOSITION_SCOPE_AND_FORMAL_PREDICATE_CUES"
      base_diagnostic_roles: "METHOD_AND_TARGET_FROM_DIAGNOSTIC_BINDING_FIELDS_NOT_DECLARED_SLOT_ROLES"
      participant_set_comparison: "EXACT"
      canonical_participant_key: [frame, semantic_role, canonical_entity_domain]
      repeated_same_role_participant: "MERGE_ONE_SLOT_UNION_SOURCE_IDS"
      same_mention_multiple_roles: "PROHIBITED"
      method_coexistence: "ADDITIVE_CANONICAL_MERGE"
      type_compatibility_only_materialization: "PROHIBITED"
      ambiguity: "PRESERVE_TYPED_COMPETITION_NO_S2_WINNER"
      catalog_direction_integrity: "SOURCE_TOKEN_MUST_EQUAL_PREDICATE_SIDE_TOKEN"
    polarity_effect:
      POSITIVE: "AFFIRMS_FINDING_EVENT_NOT_AUTOMATICALLY_ALL_PREDICATES"
      NEGATIVE: "DOES_NOT_AFFIRM_DIAGNOSED_BY_OR_EXCLUDE_INFECTION"
    required_role_derivation: "FORMAL_DIAGNOSTIC_ROLE_CATALOG_ONLY"

  EXPOSURE:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [host, disease, parasite]
    allowed_target_types: [behavior, environment]
    predicates:
      has_diagnostic_clue: {subject_from: [disease], object_from: [behavior]}
      transmitted_via: {subject_from: [parasite], object_from: [behavior]}
      risk_increased_by: {subject_from: [disease], object_from: [behavior, environment]}
    temporal_rule: "HISTORICAL_EXPOSURE_DOES_NOT_ACTIVATE_FUTURE_CONTROL"

  DEVELOPMENT:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [parasite, life_cycle_stage]
    allowed_target_types: [life_cycle_stage]
    predicates:
      has_life_cycle_stage: {subject_from: [parasite], object_from: [life_cycle_stage]}
      develops_into: {subject_from: [life_cycle_stage], object_from: [life_cycle_stage]}

  HOST_ROLE:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [parasite]
    allowed_target_types: [host]
    predicates:
      has_definitive_host: {subject_from: [parasite], object_from: [host]}
      has_first_intermediate_host: {subject_from: [parasite], object_from: [host]}
      has_second_intermediate_host: {subject_from: [parasite], object_from: [host]}
      has_paratenic_host: {subject_from: [parasite], object_from: [host]}
      has_reservoir_host: {subject_from: [parasite], object_from: [host]}
      has_vector: {subject_from: [parasite], object_from: [host]}

  INGESTION:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [host, parasite, life_cycle_stage]
    allowed_target_types: [behavior, host, life_cycle_stage]
    predicates:
      transmitted_via: {subject_from: [parasite], object_from: [behavior]}
      infective_stage_for: {subject_from: [life_cycle_stage], object_from: [host]}

  SHEDDING:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [host]
    allowed_target_types: [life_cycle_stage]
    predicates:
      sheds_stage: {subject_from: [host], object_from: [life_cycle_stage]}

  ENVIRONMENT_PRESENCE:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [life_cycle_stage, parasite]
    allowed_target_types: [environment]
    predicates:
      present_in_environment: {subject_from: [life_cycle_stage], object_from: [environment]}
      transmission_supported_by: {subject_from: [parasite], object_from: [environment]}

  INFECTION:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [parasite, life_cycle_stage]
    allowed_target_types: [host, disease]
    predicates:
      infects: {subject_from: [parasite], object_from: [host]}
      infective_stage_for: {subject_from: [life_cycle_stage], object_from: [host]}
      causes: {subject_from: [parasite], object_from: [disease]}

  PARASITISM:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [parasite, life_cycle_stage]
    allowed_target_types: [anatomical_site]
    predicates:
      parasitizes_site: {subject_from: [parasite, life_cycle_stage], object_from: [anatomical_site]}

  PATHOLOGICAL_PROCESS:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [parasite, life_cycle_stage, disease, pathological_process]
    allowed_target_types: [disease, pathological_process, anatomical_site, clinical_manifestation]
    predicates:
      pathogenic_stage_for: {subject_from: [life_cycle_stage], object_from: [disease]}
      causes: {subject_from: [parasite], object_from: [disease]}
      has_pathological_process: {subject_from: [disease], object_from: [pathological_process]}
      occurs_in: {subject_from: [pathological_process], object_from: [anatomical_site]}
      manifests_as: {subject_from: [disease], object_from: [clinical_manifestation]}
      has_complication: {subject_from: [disease], object_from: [disease]}
      epidemiologically_associated_with: {subject_from: [disease], object_from: [disease]}

  TREATMENT:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [disease]
    allowed_target_types: [treatment]
    predicates:
      treated_by: {subject_from: [disease], object_from: [treatment]}

  CONTROL:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [parasite, disease, intervention, institution_policy]
    allowed_target_types:
      - intervention
      - institution_policy
      - host
      - behavior
      - environment
      - diagnostic_method
      - treatment
    predicates:
      controlled_by:
        subject_from: [parasite, disease]
        object_from: [intervention, institution_policy]
      targets:
        subject_from: [intervention, institution_policy]
        object_from: [host, behavior, environment, diagnostic_method, treatment]
    excluded_concept_rule: "EXCLUDED_EVENT_CREATES_PROHIBITION_NOT_ACTIVATION"

  HAZARD_CLASSIFICATION:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types: [disease]
    allowed_target_types: [hazard_classification]
    predicates:
      classified_as: {subject_from: [disease], object_from: [hazard_classification]}
    boundary_required: "hazard_class_is_not_individual_certainty"

  SOURCE_TRACEABILITY:
    event_class: "NON_DIAGNOSTIC"
    allowed_actor_types:
      - parasite
      - life_cycle_stage
      - host
      - disease
      - anatomical_site
      - pathological_process
      - clinical_manifestation
      - diagnostic_method
      - treatment
      - intervention
      - behavior
      - environment
      - institution_policy
      - hazard_classification
    allowed_target_types: []
    predicates: {}
    execution_mode: "PROVENANCE_MODIFIER_ONLY"
    standalone_medical_claim_license: "PROHIBITED"
    rule: >-
      It may request provenance for candidates already licensed by a relation or
      narrative intent. It cannot itself activate a medical relation or narrative.

direct_relation_request:
  allowed_without_event: true
  requirements:
    - "at least one AFFIRMED mention root"
    - "formal predicate"
    - "nonempty directed selectors"
    - "selector types match predicate_type_matrix"
    - "exact request spans"
  lexical_trigger_alone: "PROHIBITED"

narrative_intent_mapping:
  narrative_fact:
    authority: "reviewed narrative records with formal narrative role"
    allowed_topics: [morphology]
    allowed_entity_types: [life_cycle_stage]
    allowed_event_types: [DEVELOPMENT]
    required_anchor_predicates: []
  diagnostic_evidence_integration:
    authority: "runtime-authority-projection.yml claims[].semantic_role"
    allowed_topics: [diagnosis, boundary]
    allowed_entity_types: [diagnostic_method, disease]
    allowed_event_types: [DIAGNOSTIC_FINDING, EXPOSURE]
    required_anchor_predicates: [has_diagnostic_clue]
  diagnostic_confirmation_limit:
    authority: "runtime-authority-projection.yml claims[].semantic_role"
    allowed_topics: [diagnosis, boundary]
    allowed_entity_types: [diagnostic_method, disease]
    allowed_event_types: [DIAGNOSTIC_FINDING, EXPOSURE]
    required_anchor_predicates: [has_diagnostic_clue]

event_to_narrative_derivation:
  applies_when: "narrative_intent.derivation_mode == EVENT_DERIVED"
  rules:
    - "each E basis event_type is allowlisted by narrative_intent_mapping[semantic_role].allowed_event_types"
    - "every concrete narrative entity is an event participant, method, target, or directly bound mention"
    - "topic_scope and semantic_role are an allowlisted pair"
    - "every required anchor predicate has an executable R intent sharing at least one identical AFFIRMED M/E root"
    - "anchor R and N clause scopes overlap and both cover their shared root span"
  unrelated_anchor_relation: "FAIL_CLOSED"
  selector_contains_unbound_entity: "FAIL_CLOSED"

direct_mention_to_narrative_derivation:
  applies_when: "narrative_intent.derivation_mode == DIRECT_MENTION_DERIVED"
  rules:
    - "basis contains M IDs only"
    - "concrete narrative entities occur in AFFIRMED basis mentions"
    - "entity type, topic and semantic role satisfy narrative_intent_mapping"
    - "required anchor R shares at least one identical AFFIRMED M root and clause scope"

closed_contrast_intent_derivation:
  applies_when: "R/N derivation_mode == CLOSED_CONTRAST_DERIVED"
  authority: "closed_contrast_derivations"
  rules:
    - "activation_policy is REQUIRED_CONTRAST"
    - "predicate or narrative role is exactly emitted by one closed rule"
    - "selector entities and types follow the closed rule and formal predicate matrix"
    - "emitted intent and required role share the same AFFIRMED M/E root"
  unregistered_closed_rule: "FAIL_CLOSED"

role_catalog:
  EVIDENCE_ROLE:
    epidemiologic_exposure_clue:
      authority: "reviewed semantic roles epidemiological_clue + not_confirmatory"
      allowed_predicates: [has_diagnostic_clue, transmitted_via, risk_increased_by]
    imaging_auxiliary_clue:
      authority: "reviewed semantic roles auxiliary + cannot_confirm_alone"
      allowed_predicates: [has_diagnostic_clue]
    pathogen_confirmation:
      authority: "reviewed semantic role parasitological_confirmation"
      allowed_predicates: [diagnosed_by, diagnostic_stage_for]
  SEMANTIC_BOUNDARY:
    diagnostic_clue_is_not_confirmation:
      authority: "runtime-contract.yml semantic_boundaries.diagnostic_clue_is_not_confirmation"
      allowed_predicates: [has_diagnostic_clue, diagnosed_by, diagnostic_stage_for]
    exposure_is_not_confirmation:
      authority: "runtime-contract.yml semantic_boundaries.exposure_is_not_confirmation"
      allowed_predicates: [has_diagnostic_clue, transmitted_via, diagnosed_by]
    imaging_is_not_confirmation:
      authority: "runtime-contract.yml semantic_boundaries.imaging_is_not_confirmation"
      allowed_predicates: [has_diagnostic_clue, diagnosed_by]
    association_is_not_causality:
      authority: "runtime-contract.yml semantic_boundaries.association_is_not_causality"
      allowed_predicates: [epidemiologically_associated_with, causes]
    recommendation_is_not_quantified_effect:
      authority: "runtime-contract.yml semantic_boundaries.recommendation_is_not_quantified_effect"
      allowed_predicates: [controlled_by, targets, treated_by]
    hazard_class_is_not_individual_certainty:
      authority: "runtime-contract.yml semantic_boundaries.hazard_class_is_not_individual_certainty"
      allowed_predicates: [classified_as]
    missing_coverage_must_not_be_filled_from_model_knowledge:
      authority: "runtime-contract.yml semantic_boundaries.missing_coverage_must_not_be_filled_from_model_knowledge"
      allowed_predicates: []
    diagnostic_evidence_integration:
      authority: "runtime-authority-projection.yml claims[].semantic_role"
      allowed_predicates: [has_diagnostic_clue, diagnosed_by]
    diagnostic_confirmation_limit:
      authority: "runtime-authority-projection.yml claims[].semantic_role"
      allowed_predicates: [has_diagnostic_clue, diagnosed_by]
    evidence_integration_required:
      authority: "runtime-authority-projection.yml claims[].qualifiers.evidence_integration_required"
      allowed_predicates: [has_diagnostic_clue, diagnosed_by]
    pathogen_evidence_required_for_confirmation:
      authority: "runtime-authority-projection.yml claims[].qualifiers.confirmation_role"
      allowed_predicates: [diagnosed_by, diagnostic_stage_for]
    cannot_confirm_alone:
      authority: "runtime-authority-projection.yml claims[].qualifiers.cannot_confirm_alone"
      allowed_predicates: [has_diagnostic_clue, diagnosed_by]
    not_confirmatory:
      authority: "reviewed admitted diagnostic clue qualifiers"
      allowed_predicates: [has_diagnostic_clue, diagnosed_by]
  CONTROL_ROLE:
    recommendation_not_local_effect:
      authority: "reviewed controlled_by qualifier evidence_scope"
      allowed_predicates: [controlled_by]
    recommendation_not_quantified_effect:
      authority: "reviewed controlled_by qualifier evidence_scope"
      allowed_predicates: [controlled_by]
    universal_elimination_claim_false:
      authority: "reviewed controlled_by qualifier universal_elimination_claim=false"
      allowed_predicates: [controlled_by]
    mechanism_and_recommendation:
      authority: "reviewed targets qualifier evidence_scope"
      allowed_predicates: [targets]
    interrupt_egg_entry_to_intermediate_host_waters:
      authority: "reviewed targets qualifier mechanism"
      allowed_predicates: [targets]
  TOPIC_SCOPE:
    morphology: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    diagnosis: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    life_cycle: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    transmission: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    host_roles: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    one_health: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    exposure: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    control: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    boundary: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    treatment: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    carcinogenicity: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    stage_roles: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}
    source_traceability: {authority: "query-ir-schema-candidate.yml topic_scope enum", medical_claim_license: false}

closed_contrast_derivations:
  nonconfirmatory_to_pathogen_confirmation:
    trigger_roles:
      - epidemiologic_exposure_clue
      - imaging_auxiliary_clue
      - diagnostic_clue_is_not_confirmation
      - exposure_is_not_confirmation
      - imaging_is_not_confirmation
      - diagnostic_confirmation_limit
      - cannot_confirm_alone
      - not_confirmatory
    emitted_role: "pathogen_confirmation"
    emitted_predicates: [diagnosed_by, diagnostic_stage_for]
    root_requirement: "same AFFIRMED mention or event that generated trigger role"
    may_select_claim_id: false
    other_implicit_contrast_rules: "PROHIBITED"

completeness_controls:
  every_schema_event_type_has_mapping: true
  every_schema_predicate_has_type_matrix_entry: true
  every_schema_role_value_has_role_catalog_entry: true
  every_narrative_role_has_mapping: true
  mapping_extra_event_predicate_or_role: "FAIL_CLOSED"
