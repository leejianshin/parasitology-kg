d1_d2_oracle_non_regression_gate:
  dependency: D1/D2 production proof chain invokes the frozen reference-stage-semantic-validator.py executable
  required_behavior: >-
    A legitimate D3 executable byte correction changes its SHA binding but must
    preserve CLOSED_FROZEN D01/D02 semantic behavior. D3 BUILD must independently
    re-establish all eight probe expectations below.
  probe_expectations:
    MINPROBE-M01:
      first_constraint: CNS-SOLVER-ENTITY_RESOLUTION
    MINPROBE-M05:
      first_constraint: CNS-SOLVER-ENTITY_RESOLUTION
    MINPROBE-E01:
      first_constraint: CNS-SOLVER-EVENT_IDENTITY
    MINPROBE-R01:
      first_constraint: CNS-SOLVER-ENTITY_RESOLUTION
      second_constraint: CNS-SOLVER-EVENT_RELATION_DERIVATION
    MINPROBE-N01:
      first_constraint: CNS-SOLVER-ASSERTION_SCOPE
    MINPROBE-N02:
      first_constraint: CNS-SOLVER-ASSERTION_SCOPE
    MINPROBE-Q01:
      first_constraint: CNS-SOLVER-ASSERTION_SCOPE
    MINPROBE-Q02:
      first_constraint: CNS-SOLVER-ASSERTION_SCOPE
  all_eight_post_removal_finite_solution_count: 0
  existing_d2_tamper_matrix: must remain FAIL_CLOSED
  allowed_derived_changes:
    - validator executable SHA binding
    - hashes mechanically derived from the authorized new executable bytes
  d01_d02_semantic_result_drift: PROHIBITED
  semantic_non_regression_failure:
    d3_build: FAIL_CLOSED
    d01_d02_reopen_required: true
    actions:
      - RETURN_CONTROL
      - STOP

