    - unknown kind to permissive acceptance
    - candidate-declared hash self-authorization
    - candidate-declared source-ID self-authorization
    - trace validation weakening

d04_typed_source_identifier_completeness:
  target: D04_TYPED_SOURCE_IDENTIFIER_COMPLETENESS
  purpose: >-
    Resolve legitimate identifiers actually present in the bound TYPED_SOLUTION
    object, including legitimate frame identifiers such as EF001.
  identifier_bearing_fields_may_include:
    - mention_key
    - event_key
    - frame_id
    - relation_key
    - role_key
    - narrative_key
    - forbidden_key
    - reference_key
    - override_key
    - hypothesis_id
  legitimate_references_to_those_ids:
    requirement: contained in the actual bound typed object
  required_behavior:
    id_exists_in_actual_bound_object: MAY_RESOLVE
    id_absent_from_actual_bound_object: FAIL_CLOSED
  examples:
    EF001_present: ACCEPT
    EF999_absent: FAIL_CLOSED
  prohibited:
    - accepting arbitrary strings
    - accepting arbitrary syntactically valid IDs
    - accepting arbitrary EF* IDs
    - accepting IDs not present in the actual bound object
  classification: IDENTIFIER_COMPLETENESS_CORRECTION_NOT_VALIDATION_WEAKENING

d05_retained_mention_projection_parity:
  target: D05_RETAINED_MENTION_PROJECTION_PARITY
  required_distinction: EVENT_FRAME participant source is not automatically a retained QueryIR mention
  required_projection_rule:
    left_set: event participant source_ids
    operation: INTERSECT
    right_set: surface mentions retained in typed-core resolved_mentions
    output: QueryIR event.mention_ids
  mention_mapping_source: retained typed-core mentions
  canonical_parity_case:
    source_id: U003
    may_be_legitimate_event_frame_participant_source: true
    retained_in_typed_minimal_core: false
    must_be_forced_into_queryir_mention_ids: false
  strictly_prohibited:
    - adding U003 back to resolved_mentions merely to satisfy projection
    - adding any other non-retained mention merely to satisfy projection
    - expanding the minimal core
    - changing semantic object membership
    - changing minimality semantics

d06_complete_s3_test_construction:
  target: D06_COMPLETE_S3_TEST_CONSTRUCTION
  authority_inputs_helper_alone_is_complete_stage_evidence: false
  insufficient_helper: _c3_authority_inputs()
  required_complete_production_test_chain:
