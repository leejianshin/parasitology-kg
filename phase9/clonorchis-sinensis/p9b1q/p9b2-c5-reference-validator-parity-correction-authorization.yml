    - NORMALIZED_REQUEST
    - CLAUSE_AST
    - EVENT_FRAME
    - complete normative authority inputs
    - actual persisted proof objects
    - actual disposable proof_root
    - actual hash bindings
  validation: invoke actual reference S3 validation with the complete chain
  narrow_support_plumbing:
    condition: validate_s3 cannot currently receive the actual production proof root
    permitted_change: >-
      Add an explicit optional proof-context parameter sufficient only to pass the
      supplied production proof_root into the existing proof-chain validation.
    prohibited:
      - changing proof semantics
      - generating proof objects
      - rewriting proof objects
      - repairing proof objects
      - falling back from failed production proof to fixture proof
    no_explicit_production_context: preserve compatible legacy fixture behavior

d07_complete_s4_test_construction:
  target: D07_COMPLETE_S4_TEST_CONSTRUCTION
  required_production_test_chain:
    - fresh production C4 result
    - actual typed result
    - actual QueryIR
    - actual predecessor stage objects
    - actual production proof_root
    - actual S3 proof inputs
  explicit_production_context: use that actual evidence
  prohibited_substitution: >-
    Silently substituting load_stage_result("S3") fixture evidence for the
    supplied production chain.
  narrow_support_plumbing:
    permitted_change: explicit optional S4 proof context
    functional_equivalents:
      - proof_root
      - proof_inputs
    parameter_names: implementation may choose exact names
    behavior: must remain narrowly bounded
    explicit_production_context_supplied: use supplied actual production evidence
    no_explicit_context: preserve existing legacy fixture behavior
    prohibited:
