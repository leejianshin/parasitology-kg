contract_version: "0.4-candidate"
contract_id: "clonorchis_p9b1q_request_queryir_retrieval_audit_binding_v0_4"
status: "DESIGN_CANDIDATE_PENDING_INDEPENDENT_READ_ONLY_REVIEW"

compatibility:
  p9a_request_schema: "UNCHANGED_1.0"
  p9a_response_schema: "UNCHANGED_1.2"
  p9a_audit_schema: "UNCHANGED_1.3"
  p9b1_retrieval_result_schema: "UNCHANGED_1.1"
  query_ir_schema: "CANDIDATE_0.3"
  semantic_validation_result_schema: "CANDIDATE_0.2"
  private_sidecar_schema: "CANDIDATE_0.2"
  new_p9a_reason_code: false
  new_student_visible_state: false

canonicalization:
  algorithm: "SHA256"
  serialization: "SORTED_UTF8_JSON_NO_INSIGNIFICANT_WHITESPACE"
  unicode_normalization_before_hash: "NONE"
  numbers: "JSON_SCHEMA_VALIDATED_NATIVE_JSON"
  arrays_preserve_order: true
  objects_sort_keys_recursively: true
  persisted_object_bytes: "MUST_EQUAL_THE_CANONICAL_JSON_BYTES_USED_FOR_CONTENT_SHA256"
  non_json_artifact_hashing: "SHA256_OVER_EXACT_RESOLVED_FILE_BYTES"

actual_object_requirements:
  request: "ALWAYS_REQUIRED"
  query_ir:
    required_before_retrieval: true
    must_be_schema_and_semantically_valid: true
  retrieval_result:
    required_if_retrieval_started: true
    prohibited_if_query_ir_not_executable: true
  audit_record: "ALWAYS_REQUIRED_UNDER_P9A_ONE_REQUEST_ONE_AUDIT"
  response: "FOLLOW_FROZEN_P9A_RESPONSE_AND_AUDIT_RULES"
  hash_without_corresponding_actual_object: "PROHIBITED"
  persistence:
    mode: "CONTENT_ADDRESSED_PRIVATE_OBJECT_STORE"
    object_address_prefix: "private-audit://objects/sha256/"
    artifact_address_prefix: "private-audit://artifacts/sha256/"
    resolver_must_return_actual_bytes: true
    address_digest_must_equal_actual_byte_sha256: true
    json_object_bytes_must_be_canonical_serialization: true
    missing_or_unresolvable_address: "FAIL_CLOSED"

normative_artifact_identity:
  rule: >-
    Every named artifact key resolves to the exact bytes of the one canonical
    repository path below at the bound source revision. A caller-provided file
    with the same label, contract ID, Schema ID, or version is not equivalent.
  schema_artifacts:
    p9a_request_schema: "phase9/clonorchis-sinensis/request-schema.yml"
    p9a_response_schema: "phase9/clonorchis-sinensis/response-schema.yml"
    p9a_audit_schema: "phase9/clonorchis-sinensis/audit-log-schema.yml"
    retrieval_result_schema: "phase9/clonorchis-sinensis/retrieval-result-schema.yml"
    semantic_validation_result_schema: "phase9/clonorchis-sinensis/p9b1q/semantic-validation-result-schema-candidate.yml"
    query_ir_schema: "phase9/clonorchis-sinensis/p9b1q/query-ir-schema-candidate.yml"
    query_ir_semantic_contract: "phase9/clonorchis-sinensis/p9b1q/query-ir-semantic-contract.yml"
    query_ir_semantic_validator_contract: "phase9/clonorchis-sinensis/p9b1q/query-ir-semantic-validator-contract.yml"
    event_predicate_type_role_mapping: "phase9/clonorchis-sinensis/p9b1q/event-predicate-type-role-mapping.yml"
    p9b1_retrieval_contract: "phase9/clonorchis-sinensis/p9b1-retrieval-contract.yml"
    p9a_release_boundary: "phase9/clonorchis-sinensis/release-boundary.yml"
    p9a_reviewer_evidence_admission: "phase9/clonorchis-sinensis/reviewer-evidence-admission.yml"
    request_queryir_retrieval_audit_binding_contract: "phase9/clonorchis-sinensis/p9b1q/request-queryir-retrieval-audit-binding.yml"
    ambiguity_fail_closed_rules: "phase9/clonorchis-sinensis/p9b1q/ambiguity-fail-closed-rules.yml"
    sidecar_schema: "phase9/clonorchis-sinensis/p9b1q/execution-binding-sidecar-schema-candidate.yml"
  authority_artifacts:
    runtime_bundle: "phase9/clonorchis-sinensis/runtime-bundle-manifest.yml"
    runtime_authority_projection: "phase9/clonorchis-sinensis/runtime-authority-projection.yml"
    runtime_contract: "phase9/clonorchis-sinensis/runtime-contract.yml"
    reviewed_nodes: "derived/clonorchis-sinensis/pcms-v1/nodes.jsonl"
    reviewed_edges: "derived/clonorchis-sinensis/pcms-v1/edges.jsonl"
    entity_type_schema: "schema/entity-types.yml"
    relation_type_schema: "schema/relation-types.yml"
    pcms_authority_review: "phase7/clonorchis-sinensis/pilot-content-minimum-set-authority-review.yml"
    source_registry: "sources/registry.yml"
  verification:
    - "every required sidecar artifact key appears exactly once in this map"
    - "resolved bytes equal the canonical path bytes at the bound source revision"
    - "artifact_sha256 equals SHA256 over those exact resolved bytes"
    - "content-address suffix and byte_length equal the resolved bytes"
    - "missing, extra, substituted, or path-mismatched artifacts fail closed"

binding_validation_order:
  - "SIDECAR_SCHEMA"
  - "RESOLVE_ALL_NON_NULL_OBJECT_AND_ARTIFACT_ADDRESSES"
  - "VERIFY_BYTE_LENGTH_AND_ADDRESS_DIGEST"
  - "PARSE_AND_VALIDATE_NORMATIVE_ARTIFACTS"
  - "PARSE_AND_VALIDATE_ACTUAL_OBJECTS"
  - "VERIFY_REQUEST_QUERY_IR_AND_SEMANTIC_VALIDATION_BINDING"
  - "VERIFY_SEMANTIC_VALIDATION_RESULT_SCHEMA_AND_ARTIFACT_HASHES"
  - "VERIFY_COMPONENT_EXECUTABLE_BUILD_AND_CONFIGURATION_HASHES"
  - "RECOMPUTE_QUERY_IR_SEMANTIC_VALIDATION"
  - "RECOMPUTE_RETRIEVAL_FROM_EXACT_QUERY_IR_AND_COMPONENTS_IF_STARTED"
  - "VERIFY_CANDIDATE_LICENSE_AND_PRIVATE_SEMANTIC_EXCLUSIONS"
  - "VERIFY_P9A_RESPONSE_AND_AUDIT_CROSS_OBJECT_SEMANTICS"
  - "VERIFY_SIDECAR_DISPOSITION_CONDITIONS"

binding_chain:
  request_to_query_ir:
    assertions:
      - "query_ir.request_id == request.request_id"
      - "query_ir.request_sha256 == canonical_sha256(request)"
      - "query_ir.knowledge_version == request.knowledge_version"
      - "all QueryIR spans validate against request.query_text"
      - "query_ir.producer.configuration_sha256 == components.interpreter.configuration_sha256"
      - "query_ir.producer identity and version are present in the resolved interpreter build manifest"
  query_ir_to_semantic_validation:
    assertions:
      - "semantic_validation validates against semantic-validation-result-schema-candidate.yml"
      - "semantic_validation.request_id == request.request_id"
      - "semantic_validation.request_sha256 == objects.request.content_sha256"
      - "semantic_validation.query_ir_sha256 == objects.query_ir.content_sha256"
      - "semantic_validation.knowledge_version == request.knowledge_version"
      - "semantic_validation contract/schema/mapping hashes equal the corresponding schema_artifacts digests"
      - "semantic_validation result and executable intent IDs equal deterministic recomputation from the same request and QueryIR"
      - "semantic_validation arrays exactly equal the deterministic order frozen by query-ir-semantic-validator-contract.yml v0.3"
  request_to_retrieval_result:
    assertions:
      - "retrieval_result.request_id == request.request_id"
      - "retrieval_result.request_sha256 == canonical_sha256(request)"
      - "retrieval_result.knowledge_version == request.knowledge_version"
  query_ir_to_retrieval_result:
    assertions:
      - "retrieval was executed from the exact QueryIR object named by objects.query_ir.content_sha256"
      - "candidate semantic license was evaluated against that same QueryIR object"
      - "recomputation with the same request, QueryIR, authority, and executor configuration is deterministic"
      - "recomputed retrieval bytes equal the content-addressed retrieval result bytes"
      - "the content-addressed semantic-validation object was produced by the bound deterministic semantic-validator component"
      - "the content-addressed retrieval result was produced by the bound deterministic graph-executor component"
    note: >-
      Retrieval-result schema v1.1 has no query_ir_sha256 field. The private
      binding evidence record below carries this link without changing P9-A or
      the frozen retrieval-result schema in this design atom.
  request_to_audit:
    assertions:
      - "audit.request_id == request.request_id"
      - "audit.request_sha256 == canonical_sha256(request)"
      - "audit.request_schema_version == request.schema_version"
  retrieval_to_audit:
    assertions:
      - "audit.retrieval.candidate_claim_ids equals the validated candidate IDs selected for audit"
      - "audit.retrieval.admitted_claim_ids is a subset of validated retrieved candidates"
      - "audit.decision.material_claim_ids is licensed by QueryIR and admitted by P9-A"
      - "P9-A excluded_candidates remains limited to its frozen authority-exclusion reasons"
      - "query-semantic exclusions are recorded only in the private binding sidecar and are not mislabeled as P9-A authority failures"
      - "every retrieval candidate is in exactly one query-semantic partition: licensed by a matching R/N intent or recorded once as a private query-semantic exclusion"
      - "no admitted or material claim is present in query_semantic_exclusions"
  sidecar_state_summary_to_actual_objects:
    assertions:
      - "state_summary.semantic_validation_result equals actual semantic_validation.result"
      - "state_summary.semantic_executable_intent_count equals the total unique executable R/N IDs in semantic_validation"
      - "state_summary.retrieval_present equals whether objects.retrieval_result is non-null"
      - "state_summary.audit_* fields equal the actual P9-A audit decision, output_validation and response_sha256 fields"
      - "state_summary.response_present equals whether objects.response is non-null"
      - "non-null response disposition and validation fields equal the actual P9-A response object"
      - "audit.response_sha256 equals objects.response.content_sha256 when response exists and is null otherwise"
      - "audit and response request_id, knowledge_version, runtime bundle and disposition agree"
    mirror_is_not_authority: true
    any_mismatch: "FAIL_CLOSED"

private_binding_evidence_record:
  schema: "phase9/clonorchis-sinensis/p9b1q/execution-binding-sidecar-schema-candidate.yml"
  storage_role: "PRIVATE_NON_STUDENT_AUDIT_SIDECAR"
  public_export_allowed: false
  one_record_per_request: true
  actual_object_references:
    - "request"
    - "query_ir"
    - "semantic_validation"
    - "retrieval_result_or_null"
    - "audit_record"
    - "response_or_null"
  schema_and_contract_artifact_references:
    - "p9a_request_schema"
    - "p9a_response_schema"
    - "p9a_audit_schema"
    - "retrieval_result_schema"
    - "semantic_validation_result_schema"
    - "query_ir_schema"
    - "query_ir_semantic_contract"
    - "query_ir_semantic_validator_contract"
    - "event_predicate_type_role_mapping"
    - "p9b1_retrieval_contract"
    - "p9a_release_boundary"
    - "p9a_reviewer_evidence_admission"
    - "request_queryir_retrieval_audit_binding_contract"
    - "ambiguity_fail_closed_rules"
    - "sidecar_schema"
  authority_artifact_references:
    - "runtime_bundle"
    - "runtime_authority_projection"
    - "runtime_contract"
    - "reviewed_nodes"
    - "reviewed_edges"
    - "entity_type_schema"
    - "relation_type_schema"
    - "pcms_authority_review"
    - "source_registry"
  component_references:
    - "interpreter executable/build/configuration"
    - "deterministic semantic validator executable/build/configuration"
    - "deterministic graph executor executable/build/configuration"
  semantic_conditions:
    - "QUERY_IR_VALID_RETRIEVED requires semantic PASS, at least one executable R/N, and a non-null retrieval-result object reference."
    - "QUERY_IR_FAIL_CLOSED requires semantic FAIL_CLOSED, zero executable R/N, a null retrieval result, and P9-A ABSTAIN with NO_SAFE_ADMITTED_ANSWER."
    - "P9-A ANSWER/PARTIAL requires a non-null matching response, PASS output validation, and no hard-fail code."
    - "P9-A ABSTAIN requires FAIL_CLOSED output validation; a response may be absent or must itself be an ABSTAIN response."
    - "The sidecar audit_id and request binding must match the actual P9-A audit object."
    - "Every non-null content address resolves to actual immutable bytes before validation."
    - "Every schema/contract/authority key resolves to its unique normative_artifact_identity path at the bound source revision."
    - "Address suffix, declared digest, actual byte digest, and declared byte length match."
    - "authority_artifacts.runtime_bundle.artifact_sha256 equals SHA256 over the exact runtime-bundle-manifest.yml bytes."
    - "runtime_bundle_sha256 equals the parsed runtime-bundle-manifest.yml bundle_sha256 field, not the manifest file-byte digest."
    - "request, retrieval, audit and response runtime-bundle values equal that parsed logical bundle_sha256 wherever their frozen Schemas define the field."
    - "Component executable/build/configuration artifacts are resolved and their digest and byte length are verified."
    - "Semantic-validator and graph-executor implementation_kind are DETERMINISTIC."
    - "The sidecar is validated and hashed only after all actual objects exist."
    - >-
      Each query_semantic_exclusions item contains claim_id, the matching
      prohibition_id or missing-license reason, and one of
      FORBIDDEN_RELATION_MATCH, NO_AFFIRMED_INTENT_LICENSE,
      DIRECTION_MISMATCH, TEMPORAL_SCOPE_MISMATCH, or
      NARRATIVE_ROLE_OR_ENTITY_MISMATCH.
  limitation: >-
    This sidecar preserves internal traceability while P9-A remains frozen. It
    does not make QueryIR visible to students and does not add a new P9-A field.

ambiguity_path:
  query_ir_interpretation_status: [AMBIGUOUS, UNSUPPORTED]
  retrieval_started: false
  retrieval_result_exists: false
  p9a_disposition: "ABSTAIN"
  p9a_hard_fail_code: "NO_SAFE_ADMITTED_ANSWER"
  p9a_material_claim_ids: []
  student_visible_medical_claim: "PROHIBITED"
  internal_detail_location: "PRIVATE_BINDING_EVIDENCE_AND_QUERY_IR_AMBIGUITIES"

tamper_and_mismatch_policy:
  request_hash_mismatch: "FAIL_CLOSED"
  query_ir_hash_mismatch: "FAIL_CLOSED"
  result_hash_mismatch: "FAIL_CLOSED"
  audit_hash_mismatch: "FAIL_CLOSED"
  request_id_mismatch_at_any_link: "FAIL_CLOSED"
  knowledge_version_mismatch: "FAIL_CLOSED"
  query_ir_recomputed_from_different_request: "FAIL_CLOSED"
  result_recomputed_from_different_query_ir: "FAIL_CLOSED"
  orphan_hash_or_orphan_object: "FAIL_CLOSED"
  unresolvable_content_address: "FAIL_CLOSED"
  address_digest_or_length_mismatch: "FAIL_CLOSED"
  interpreter_executable_or_build_drift: "FAIL_CLOSED"
  validator_executable_or_build_drift: "FAIL_CLOSED"
  executor_executable_or_build_drift: "FAIL_CLOSED"
  component_configuration_drift: "FAIL_CLOSED"
  semantic_validation_recompute_mismatch: "FAIL_CLOSED"
  semantic_validation_array_order_mismatch: "FAIL_CLOSED"
  semantic_validation_schema_or_contract_hash_mismatch: "FAIL_CLOSED"
  normative_artifact_identity_or_path_mismatch: "FAIL_CLOSED"
  runtime_bundle_logical_digest_or_manifest_digest_mismatch: "FAIL_CLOSED"
  state_summary_actual_object_mismatch: "FAIL_CLOSED"
  candidate_license_recompute_mismatch: "FAIL_CLOSED"

acceptance_probes:
  positive:
    - "valid request -> valid QueryIR -> validated retrieval -> matching P9-A audit"
    - "ambiguous request -> no retrieval -> P9-A safe abstain -> complete private binding sidecar"
  negative:
    - "tampered request after QueryIR creation"
    - "tampered QueryIR after retrieval"
    - "request_id mismatch between QueryIR and result"
    - "retrieval result copied from another QueryIR for the same request"
    - "audit copied from another request"
    - "non-null result hash without actual result object"
    - "content address resolves to bytes with a different digest or length"
    - "interpreter code changes while version/configuration labels stay constant"
    - "semantic validator code or mapping changes after QueryIR creation"
    - "normative contract key resolves to substituted bytes or a noncanonical path"
    - "runtime bundle logical digest is replaced by the manifest file-byte digest"
    - "semantic-validation result reports PASS with zero executable R/N"
    - "semantic-validation array membership is unchanged but one array is reordered"
    - "sidecar state summary is changed without changing the actual audit/response objects"
    - "executor artifact changes while result object is reused"
    - "query semantic exclusion is mislabeled as a P9-A authority exclusion"
