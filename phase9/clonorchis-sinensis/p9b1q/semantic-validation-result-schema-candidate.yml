$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/parasitology-kg/phase9/p9b1q/semantic-validation-result-v0.2"
title: "P9-B1Q deterministic semantic validation result candidate"
description: >-
  Closed machine result for validating one actual QueryIR against one actual
  P9-A request and the exact content-addressed semantic contracts and mapping.
type: object
additionalProperties: false
required:
  - schema_version
  - validation_id
  - request_schema_valid
  - request_id
  - request_sha256
  - query_ir_sha256
  - knowledge_version
  - query_ir_schema_valid
  - query_ir_interpretation_status
  - query_ir_schema_sha256
  - semantic_contract_sha256
  - semantic_validator_contract_sha256
  - event_mapping_sha256
  - result
  - fail_codes
  - executable_relation_intent_ids
  - executable_narrative_intent_ids
  - prohibited_relation_intent_ids
  - superseded_event_ids
properties:
  schema_version: {const: "0.2-candidate"}
  validation_id:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
  request_schema_valid: {const: true}
  request_id:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
  request_sha256: {$ref: "#/$defs/sha256"}
  query_ir_sha256: {$ref: "#/$defs/sha256"}
  knowledge_version: {const: "clonorchis_pcms_v1"}
  query_ir_schema_valid: {type: boolean}
  query_ir_interpretation_status:
    oneOf:
      - {enum: [VALID, AMBIGUOUS, UNSUPPORTED]}
      - {type: "null"}
  query_ir_schema_sha256: {$ref: "#/$defs/sha256"}
  semantic_contract_sha256: {$ref: "#/$defs/sha256"}
  semantic_validator_contract_sha256: {$ref: "#/$defs/sha256"}
  event_mapping_sha256: {$ref: "#/$defs/sha256"}
  result: {enum: [PASS, FAIL_CLOSED]}
  fail_codes:
    description: >-
      Unique codes in the exact enum-ordinal order frozen by
      query-ir-semantic-validator-contract.yml v0.3.
    type: array
    uniqueItems: true
    items: {$ref: "#/$defs/fail_code"}
  executable_relation_intent_ids:
    description: >-
      Unique R IDs in the frozen numeric-suffix, suffix-length, raw-byte order.
    type: array
    uniqueItems: true
    items: {type: string, pattern: "^R[0-9]{2,3}$"}
  executable_narrative_intent_ids:
    description: >-
      Unique N IDs in the frozen numeric-suffix, suffix-length, raw-byte order.
    type: array
    uniqueItems: true
    items: {type: string, pattern: "^N[0-9]{2,3}$"}
  prohibited_relation_intent_ids:
    description: >-
      Unique F IDs in the frozen numeric-suffix, suffix-length, raw-byte order.
    type: array
    uniqueItems: true
    items: {type: string, pattern: "^F[0-9]{2,3}$"}
  superseded_event_ids:
    description: >-
      Unique E IDs in the frozen numeric-suffix, suffix-length, raw-byte order.
    type: array
    uniqueItems: true
    items: {type: string, pattern: "^E[0-9]{2,3}$"}
allOf:
  - if:
      properties: {query_ir_schema_valid: {const: false}}
    then:
      properties:
        query_ir_interpretation_status: {type: "null"}
        result: {const: FAIL_CLOSED}
        fail_codes:
          type: array
          contains: {const: QUERY_IR_SCHEMA_INVALID}
          minContains: 1
  - if:
      properties: {query_ir_schema_valid: {const: true}}
    then:
      properties:
        query_ir_interpretation_status: {enum: [VALID, AMBIGUOUS, UNSUPPORTED]}
  - if:
      properties: {result: {const: PASS}}
    then:
      properties:
        query_ir_schema_valid: {const: true}
        query_ir_interpretation_status: {const: VALID}
        fail_codes: {type: array, maxItems: 0}
      anyOf:
        - properties:
            executable_relation_intent_ids: {type: array, minItems: 1}
        - properties:
            executable_narrative_intent_ids: {type: array, minItems: 1}
  - if:
      properties: {result: {const: FAIL_CLOSED}}
    then:
      properties:
        fail_codes: {type: array, minItems: 1}
        executable_relation_intent_ids: {type: array, maxItems: 0}
        executable_narrative_intent_ids: {type: array, maxItems: 0}
$defs:
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  fail_code:
    enum:
      - REQUEST_HASH_OR_ID_MISMATCH
      - QUERY_IR_SCHEMA_INVALID
      - GENERATED_PAYLOAD_BOUNDARY_VIOLATION
      - SPAN_MISMATCH
      - DUPLICATE_OR_DANGLING_ID
      - CLAUSE_GRAPH_INVALID
      - OR_GROUP_INVALID_OR_UNRESOLVED
      - OR_BRANCH_COVERAGE_INVALID
      - REFERENCE_INVALID_OR_AMBIGUOUS
      - OVERRIDE_INVALID_OR_AMBIGUOUS
      - UNKNOWN_OR_UNREVIEWED_ENTITY
      - ENTITY_TYPE_MISMATCH
      - UNKNOWN_PREDICATE_OR_ROLE
      - EVENT_FIELD_OR_TYPE_MISMATCH
      - EVENT_INTENT_DERIVATION_MISMATCH
      - NARRATIVE_INTENT_DERIVATION_MISMATCH
      - DEPENDENCY_GRAPH_INVALID
      - NO_AFFIRMED_SEMANTIC_ROOT
      - RELATION_DIRECTION_OR_SELECTOR_INVALID
      - NARRATIVE_INTENT_INVALID
      - ROLE_AUTHORITY_OR_CONTRAST_INVALID
      - REQUIRED_FORBIDDEN_INTENT_CONFLICT
      - NON_MATERIAL_CONTEXT_ACTIVATED
      - NO_EXECUTABLE_INTENT
      - AMBIGUITY_OPTION_MISMATCH
      - UNRESOLVED_AMBIGUITY
