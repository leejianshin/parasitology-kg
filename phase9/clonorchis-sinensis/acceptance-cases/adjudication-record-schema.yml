$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/parasitology-kg/phase9/adjudication-record-schema-v1"
title: "P9-A critical disagreement adjudication record"
type: object
additionalProperties: false
required:
  - schema_version
  - adjudication_id
  - adjudication_case_id
  - legacy_case_id
  - source_case_sha256
  - decision_authority
  - decision
  - resulting_disposition
  - rationale
  - decided_at
properties:
  schema_version: {const: "1.0"}
  adjudication_id: {type: string, minLength: 1}
  adjudication_case_id: {const: "P9A-ADJ-001"}
  legacy_case_id: {const: "CS-RAG-F03"}
  source_case_sha256:
    const: "5cfeeeee90808f07fc90a16a4549ba07ee35d441d4544a46fea6461f77d6a258"
  decision_authority: {const: "COURSE_LEAD"}
  decision:
    enum:
      - "CONFIRM_CURRENT_CONTRACT"
      - "REVISE_CONTRACT"
      - "EXCLUDE_WITH_JUSTIFICATION"
  resulting_disposition:
    enum: ["ANSWER", "PARTIAL", "ABSTAIN", "EXCLUDED"]
  rationale: {type: string, minLength: 1}
  decided_at: {type: string, format: date-time}
