review_intake_contract:
  completion_status_enum:
    - "COMPLETE"
    - "PROVISIONAL"
    - "INCOMPLETE"
    - "INVALID_FOR_AGGREGATION"
  top_level_conclusion_enum:
    - "PASS"
    - "CHANGES_REQUIRED"
    - "FAIL"
    - "PENDING"
  release_recommendation_enum:
    - "RECOMMEND_RELEASE"
    - "DO_NOT_RELEASE"
    - "PENDING"
  aggregation_requires:
    completion_status: "COMPLETE"
    all_required_case_scores_present: true
    top_level_conclusion_allowed:
      - "PASS"
      - "CHANGES_REQUIRED"
      - "FAIL"
    release_recommendation_allowed:
      - "RECOMMEND_RELEASE"
      - "DO_NOT_RELEASE"
    metadata_valid: true
    unresolved_critical_disagreement: false
  unresolved_critical_disagreement:
    release_effect: "BLOCK"
    resolution: "COURSE_LEAD_CASE_LEVEL_ADJUDICATION_REQUIRED"
  public_identity_policy: "DEIDENTIFIED_REVIEWER_IDS_ONLY"
  raw_workbook_policy: "PRIVATE_ONLY"
