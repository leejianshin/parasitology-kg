$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/parasitology-kg/phase9/p9b1q/reference-validator-execution-summary-v0.1"
title: "P9-B1Q reference validator execution summary"
type: object
additionalProperties: false
required:
  - summary_version
  - validator_id
  - validator_version
  - executable_sha256
  - configuration_path
  - configuration_sha256
  - repeat_runs
  - run_payload_sha256
  - result
  - registry_failure_governance
  - positive
  - minimality
  - negative
  - positive_pass_count
  - minimality_pass_count
  - negative_pass_count
  - schema_gate
properties:
  summary_version: {const: "0.1-candidate"}
  validator_id: {const: p9b1q-reference-stage-semantic-validator}
  validator_version: {const: "0.1"}
  executable_sha256: {$ref: "#/$defs/sha256"}
  configuration_path: {const: stage-semantic-validator-contract.yml}
  configuration_sha256: {$ref: "#/$defs/sha256"}
  repeat_runs: {const: 3}
  run_payload_sha256: {$ref: "#/$defs/sha256"}
  result: {const: PASS}
  registry_failure_governance:
    type: object
    additionalProperties: false
    required:
      - registry_mapping_count
      - validator_constraint_mapping_count
      - executable_constraint_count
      - formal_fixture_count
      - explicit_fixture_failure_code_count
      - match_count
      - mismatch_count
      - unknown_constraint_ids
      - validator_failure_code_mismatches
      - fixture_failure_code_mismatches
      - missing_fixture_failure_codes
      - missing_executable_constraints
      - unregistered_constraint_outputs
      - unregistered_failure_code_mappings
      - multi_authority_failure_code_mappings
      - multi_failure_code_mappings
      - unauthorized_dynamic_output_calls
      - registry_bound_dynamic_calls
      - wrong_fixture_code_gate
      - missing_fixture_code_gate
      - unknown_constraint_gate
      - validator_registry_mapping_gate
      - s4_minimality_fixture_governed
      - result
    properties:
      registry_mapping_count: {const: 47}
      validator_constraint_mapping_count: {const: 47}
      executable_constraint_count: {const: 47}
      formal_fixture_count: {const: 80}
      explicit_fixture_failure_code_count: {const: 80}
      match_count: {const: 47}
      mismatch_count: {const: 0}
      unknown_constraint_ids: {const: 0}
      validator_failure_code_mismatches: {const: 0}
      fixture_failure_code_mismatches: {const: 0}
      missing_fixture_failure_codes: {const: 0}
      missing_executable_constraints: {const: 0}
      unregistered_constraint_outputs: {const: 0}
      unregistered_failure_code_mappings: {const: 0}
      multi_authority_failure_code_mappings: {const: 0}
      multi_failure_code_mappings: {const: 0}
      unauthorized_dynamic_output_calls: {const: 0}
      registry_bound_dynamic_calls: {type: integer, minimum: 1}
      wrong_fixture_code_gate: {const: REJECT}
      missing_fixture_code_gate: {const: REJECT}
      unknown_constraint_gate: {const: REJECT}
      validator_registry_mapping_gate: {const: REJECT}
      s4_minimality_fixture_governed: {const: true}
      result: {const: PASS}
  positive:
    type: array
    minItems: 15
    maxItems: 15
    uniqueItems: true
    items: {$ref: "#/$defs/positive_result"}
  minimality:
    type: array
    minItems: 8
    maxItems: 8
    uniqueItems: true
    items: {$ref: "#/$defs/minimality_result"}
  negative:
    type: array
    minItems: 64
    maxItems: 64
    uniqueItems: true
    items: {$ref: "#/$defs/negative_result"}
  positive_pass_count: {const: 15}
  minimality_pass_count: {const: 8}
  negative_pass_count: {const: 64}
  schema_gate:
    type: object
    additionalProperties: false
    required: [gate_id, ajv_version, strict, compiled_schema_count, fixture_pair_count, valid_fixture_count, result, runner_sha256, lockfile_sha256]
    properties:
      gate_id: {const: p9b1q-ajv-draft2020-strict}
      ajv_version: {const: "8.17.1"}
      strict: {const: true}
      compiled_schema_count: {const: 12}
      fixture_pair_count: {const: 31}
      valid_fixture_count: {const: 31}
      result: {const: PASS}
      runner_sha256: {$ref: "#/$defs/sha256"}
      lockfile_sha256: {$ref: "#/$defs/sha256"}
$defs:
  sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
  constraint_id: {type: string, pattern: "^CNS-[A-Z0-9_-]{3,96}$"}
  validation_error:
    type: object
    additionalProperties: false
    required: [constraint_id, failure_code, json_pointer]
    properties:
      constraint_id: {$ref: "#/$defs/constraint_id"}
      failure_code: {type: string, pattern: "^[A-Z][A-Z0-9_]{2,95}$"}
      json_pointer: {type: string, pattern: "^/"}
  positive_result:
    type: object
    additionalProperties: false
    required: [case, errors]
    properties:
      case: {type: string, pattern: "^(POS-S[0-5]-(exposure|diagnostic|shared-argument)|POS-R3B-[A-Z0-9-]+)$"}
      errors: {type: array, maxItems: 0}
  minimality_result:
    type: object
    additionalProperties: false
    required: [probe_id, candidate_sha256, observed_unsatisfied_constraint_ids, passed]
    properties:
      probe_id: {type: string, pattern: "^MINPROBE-(M|E|R|N|Q|F|REF|OVR)[0-9]{2,3}$"}
      candidate_sha256: {$ref: "#/$defs/sha256"}
      observed_unsatisfied_constraint_ids:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: "#/$defs/constraint_id"}
      passed: {const: true}
  negative_result:
    type: object
    additionalProperties: false
    required: [fixture_id, observed_first_error, expected_constraint_id, registry_failure_code, fixture_failure_code, semantic_mutation_target_count, semantic_mutation_target, derived_update_count, passed]
    properties:
      fixture_id: {type: string, pattern: "^(NEG-S[0-5]-[A-Z0-9-]+|R3B-NEG-[A-Z0-9-]+)$"}
      observed_first_error: {$ref: "#/$defs/validation_error"}
      expected_constraint_id: {$ref: "#/$defs/constraint_id"}
      registry_failure_code: {type: string, pattern: "^[A-Z][A-Z0-9_]{2,95}$"}
      fixture_failure_code:
        type: string
        pattern: "^[A-Z][A-Z0-9_]{2,95}$"
      semantic_mutation_target_count: {const: 1}
      semantic_mutation_target:
        type: object
        additionalProperties: false
        required: [target_object, target_path]
        properties:
          target_object: {type: string, minLength: 1}
          target_path: {type: string, pattern: "^/"}
      derived_update_count: {type: integer, minimum: 0}
      passed: {const: true}
