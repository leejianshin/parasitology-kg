baseline_observation:
  implementation_commit: 6ac0e4b2978e5fb41e7b90e27ced17826d35a394
  schema_valid_QueryIR: 24/24
  deterministic_runs: 24/24
  exact_QueryIR: 0/24
  exact_semantic_result: 8/24
  required_Top12_recall: 15/24
  exact_candidate_license: 12/24
