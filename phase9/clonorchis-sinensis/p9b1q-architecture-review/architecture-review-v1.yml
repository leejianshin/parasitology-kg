central_finding: >-
  The implementation is deterministic and Schema-valid, but it is not a
  deterministic semantic compiler. It constructs QueryIR directly from local
  lexical observations without first producing a complete scope tree, normalized
  event frames, and a globally solved typed constraint system. Local consistency
  therefore coexists with systematic structural disagreement.

root_causes:
  clause_structure:
    observed_r10_mismatch_cases: 24
    current_mechanism:
      - "punctuation-first flat splitting"
      - "special cases for OR/condition/contrast/override"
      - "no explicit operator tree or attachment alternatives"
    architectural_failure: >-
      Punctuation segments are treated as semantic clauses. Connectives and
      question focus are not represented as compositional operators, so negation,
      conditions, alternatives and later overrides cannot share one authoritative
      scope graph.
    required_replacement: "CLAUSE_AST_WITH_EXACT_SPANS_AND_TYPED_OPERATOR_NODES"

  mention_and_reference_resolution:
    observed_r10_mismatch_cases: 22
    current_mechanism:
      - "global alias occurrence scan"
      - "greedy overlap resolution"
      - "no antecedent or attachment constraint solving"
    architectural_failure: >-
      Alias recognition collapses candidate generation and semantic resolution.
      A surface form is either accepted or dropped before syntactic scope and
      event-role constraints are available; unresolved reference alternatives are
      not preserved for fail-closed adjudication.
    required_replacement: "MENTION_LATTICE_RESOLVED_ONLY_BY_TYPED_CONSTRAINTS"

  negation_and_temporal_scope:
    observed_event_mismatch_cases: 23
    current_mechanism:
      - "fixed-radius text windows"
      - "first matching positive/negative marker"
      - "clause-wide hypothetical or exclusion flags"
    architectural_failure: >-
      Polarity is inferred independently for each mention/event without a scope
      operator that identifies what proposition is negated, excluded,
      hypothetical, historical or future. Double negation and object negation can
      therefore be deterministic but attach to the wrong event.
    required_replacement: "ASSERTION_ENVELOPE_DERIVED_FROM_AST_SCOPE_PATH"

  event_identity_and_override:
    observed_override_mismatch_cases: 1
    current_mechanism:
      - "event identity assembled after local event creation"
      - "later marker plus hand-built equality tuple"
    architectural_failure: >-
      Identity is not a first-class typed object. Method, specimen, target and
      participants may be unresolved when override matching runs, so same-event
      and different-event interpretations cannot be compared globally.
    required_replacement: "NORMALIZED_EVENT_SIGNATURE_SOLVED_BEFORE_OVERRIDE"

  ambiguity:
    observed_r10_mismatch_cases: 10
    interpretation_status_mismatch_cases: 9
    current_mechanism:
      - "enumerated detectors for OR and selected missing polarities"
      - "no count of globally satisfying interpretations"
    architectural_failure: >-
      Ambiguity is detected by marker-specific branches instead of by solution
      cardinality. The system can label a single local ambiguity while missing a
      referent, attachment or direction ambiguity elsewhere, or can retrieve from
      one arbitrarily selected parse.
    required_replacement: "ZERO_ONE_MULTIPLE_SOLUTION_SEMANTICS"

  relation_and_role_license:
    observed_relation_mismatch_cases: 22
    observed_role_mismatch_cases: 22
    current_mechanism:
      - "topic/predicate cue activation"
      - "open selector fallback"
      - "post hoc relation and role construction"
    architectural_failure: >-
      Relation direction, selector content, required contrast and prohibitions are
      emitted before all event, scope and entity constraints are jointly proven.
      Recall may remain high because broad typed selectors license graph records,
      but plan precision and exact candidate license fall.
    required_replacement: "UNIQUE_TYPED_SOLUTION_THEN_PURE_QUERYIR_EMISSION"

why_public_regression_was_misleading:
  public_tests_passed: "25/25"
  explanation:
    - "public cases exercised intended local branches"
    - "tests checked selected fields more often than complete semantic-object equality"
    - "implementation and public tests shared the same decomposition assumptions"
    - "Schema validity proved shape, not semantic uniqueness or minimality"
    - "retrieval recall could mask pre-retrieval over-broad or missing plans"
  governance_conclusion: >-
    Future public tests must be generated from stage contracts and metamorphic
    invariants, not only from examples that the implementation author can see.

