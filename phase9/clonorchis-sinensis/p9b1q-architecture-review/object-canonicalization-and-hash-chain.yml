        - direct_mention_to_narrative_derivation
        - closed_contrast_intent_derivation
        - role_catalog
        - closed_contrast_derivations
      canonical_sha256: "f70292f4c772ecf75c3d35643da3d1e764907cb35b05255b603293a0fd986166"

object_chain:
  S0_NORMALIZED_REQUEST:
    actual_inputs: [P9A_REQUEST]
    actual_output: NORMALIZED_REQUEST
