    independent_hash_fields: "EVERY_RESOLVED_ACTUAL_OBJECT_CANONICAL_SHA256"

binding_invariants:
  - "request_id is identical across all request-derived objects"
  - "every downstream bound hash equals recomputation over its actual resolved object"
  - "every stage validation result binds the actual input and output object references"
  - "an object hash cannot stand in for another object kind even when bytes happen to match"
  - "aggregate ontology_sha256 is prohibited"
  - "missing actual object, noncanonical persisted bytes, wrong path, or wrong object kind fails closed"
  - "no retrieval object may exist unless S0 through S4 all PASS"
  - "typed solution cores, semantic universes and removal probes are persisted as independently resolvable canonical JSON objects"
  - "a source ID is interpreted only in the namespace of its declared actual object kind and must resolve there"
