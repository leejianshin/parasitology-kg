profile_version: "0.1-candidate"
profile_id: "clonorchis_p9b1q_compiler_object_canonicalization_v0_1"
status: "FROZEN_FOR_INDEPENDENT_READ_ONLY_REVIEW"

compatibility:
  existing_binding_contract: "phase9/clonorchis-sinensis/p9b1q/request-queryir-retrieval-audit-binding.yml"
  serialization: "SORTED_UTF8_JSON_NO_INSIGNIFICANT_WHITESPACE"
  unicode_normalization_before_hash: "NONE"
  arrays_preserve_order: true
  objects_sort_keys_recursively: true
  non_json_artifact_hashing: "SHA256_OVER_EXACT_RESOLVED_FILE_BYTES"

runtime_json_object_canonicalization:
  input_requirement: "JSON_SCHEMA_VALIDATED_NATIVE_JSON_WITHOUT_NONFINITE_NUMBERS"
  algorithm_steps:
    - "serialize null/boolean/string/number using the frozen existing binding implementation"
    - "sort every object key by Unicode code point before serialization"
    - "serialize arrays in their already contract-normalized order"
    - "emit UTF-8 with no BOM and no insignificant whitespace"
    - "compute lowercase SHA-256 over the exact emitted bytes"
  persisted_bytes_must_equal_hashed_bytes: true
  hash_of_manifest_string_without_actual_object: "FAIL_CLOSED"

normative_file_canonicalization:
  rule: "SHA256 over exact bytes resolved from the canonical repository path at the bound commit"
  same_id_or_filename_from_another_path: "NOT_EQUIVALENT"
  YAML_parse_and_reserialize_before_hash: false

normative_subobject_canonicalization:
  source_path: "phase9/clonorchis-sinensis/p9b1q/event-predicate-type-role-mapping.yml"
  parse: "YAML 1.2 safe data model"
  serialization: "runtime JSON object canonicalization above"
  objects:
    PREDICATE_TYPE_MAPPING:
      included_top_level_keys: [predicate_type_matrix]
      canonical_sha256: "ec463903f5eb37921ef4393e903814a71ef7a3ee50a28c5bd673db8fe8186961"
    EVENT_RELATION_MAPPING:
      included_top_level_keys:
        - event_field_defaults
        - derivation_source_tokens
        - event_to_relation_derivation
        - direct_mention_to_relation_derivation
        - event_mapping
        - direct_relation_request
      canonical_sha256: "5024b466e94fc0267cd34cabb86067523f267868a22480f150bbcdb0c7c68807"
    SEMANTIC_ROLE_MAPPING:
      included_top_level_keys:
        - narrative_intent_mapping
