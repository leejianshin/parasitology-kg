$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/parasitology-kg/phase9/p9b1q/minimality-proof-v0.1"
title: "P9-B1Q executable minimality proof objects"
oneOf:
  - {$ref: "#/$defs/semantic_universe"}
  - {$ref: "#/$defs/removal_probe"}
$defs:
  sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
  semantic_id: {type: string, pattern: "^(M|E|R|N|Q|F|REF|OVR)[0-9]{2,3}$"}
  semantic_object:
    type: object
    additionalProperties: false
    required: [semantic_object_id, object_kind, query_ir_json_pointer, canonical_sha256]
    properties:
      semantic_object_id: {$ref: "#/$defs/semantic_id"}
      object_kind: {enum: [MENTION, EVENT, RELATION_INTENT, NARRATIVE_INTENT, REQUIRED_ROLE, FORBIDDEN_RELATION, REFERENCE, OVERRIDE]}
      query_ir_json_pointer: {type: string, pattern: "^/"}
      canonical_sha256: {$ref: "#/$defs/sha256"}
  semantic_universe:
    type: object
    additionalProperties: false
    required: [proof_object_version, proof_object_kind, request_id, query_ir_sha256, semantic_objects]
    properties:
      proof_object_version: {const: "0.1-candidate"}
      proof_object_kind: {const: SEMANTIC_UNIVERSE}
      request_id: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"}
      query_ir_sha256: {$ref: "#/$defs/sha256"}
      semantic_objects:
        type: array
        minItems: 1
        maxItems: 2048
        uniqueItems: true
        items: {$ref: "#/$defs/semantic_object"}
  patch_operation:
    type: object
    additionalProperties: false
    required: [op, path]
    properties:
      op: {const: remove}
      path: {type: string, pattern: "^/(resolved_mentions|resolved_events|resolved_relations|semantic_roles|narrative_intents|forbidden_relations|resolved_references|resolved_overrides)/[0-9]+$"}
  removal_probe:
    type: object
    additionalProperties: false
    required:
      - proof_object_version
      - proof_object_kind
      - probe_id
      - request_id
      - base_typed_solution_path
      - base_typed_solution_sha256
      - removed_semantic_object_id
      - removed_query_ir_json_pointer
      - mutation
      - candidate_typed_solution_sha256
      - validator_contract_sha256
      - validator_executable_sha256
      - validator_configuration_sha256
      - constraint_set_sha256
      - expected_result
      - expected_unsatisfied_constraint_ids
    properties:
      proof_object_version: {const: "0.1-candidate"}
      proof_object_kind: {const: REMOVAL_PROBE}
      probe_id: {type: string, pattern: "^MINPROBE-(M|E|R|N|Q|F|REF|OVR)[0-9]{2,3}$"}
      request_id: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"}
      base_typed_solution_path: {const: "fixtures/typed-solution-exposure-positive.json"}
      base_typed_solution_sha256: {$ref: "#/$defs/sha256"}
      removed_semantic_object_id: {$ref: "#/$defs/semantic_id"}
      removed_query_ir_json_pointer: {type: string, pattern: "^/"}
      mutation:
        type: array
        minItems: 1
        maxItems: 1
        items: {$ref: "#/$defs/patch_operation"}
      candidate_typed_solution_sha256: {$ref: "#/$defs/sha256"}
      validator_contract_sha256: {$ref: "#/$defs/sha256"}
      validator_executable_sha256: {$ref: "#/$defs/sha256"}
      validator_configuration_sha256: {$ref: "#/$defs/sha256"}
      constraint_set_sha256: {$ref: "#/$defs/sha256"}
      expected_result: {const: FAIL_CLOSED}
      expected_unsatisfied_constraint_ids:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, pattern: "^CNS-[A-Z0-9_-]{3,96}$"}
