projection_rule_set_version: "0.3-candidate"
projection_rule_set_id: "clonorchis_p9b1q_queryir_projection_rules_v0_3"
status: "FROZEN_FOR_SIXTH_INDEPENDENT_READ_ONLY_REVIEW"
input_schema: "typed-constraint-result-schema-candidate.yml"
emission_record_schema: "queryir-emission-record-schema-candidate.yml"
output_schema: "../p9b1q/query-ir-schema-candidate.yml"

rules:
  - id: PRJ-VERIFY_UNIQUE
    operation: ASSERT_EQUAL
    input_pointer: /status
    expected_constant: UNIQUE
  - id: PRJ-VERIFY_ONE
    operation: ASSERT_EQUAL
    input_pointer: /solution_cardinality
    expected_constant: ONE
  - id: PRJ-VERIFY_EMBEDDED_VALID
    operation: ASSERT_EQUAL
    input_pointer: /selected_solution/queryir_emission_record/query_ir/interpretation_status
    expected_constant: VALID
  - id: PRJ-VERIFY_CORE_HASH
    operation: RECOMPUTE_HASH_EXCLUDING_POINTER
    input_pointer: /selected_solution
    excluded_pointer: /selected_solution/queryir_emission_record
    expected_hash_pointer: /selected_solution/queryir_emission_record/semantic_solution_core_sha256
  - id: PRJ-VERIFY_QUERYIR_HASH
    operation: RECOMPUTE_CANONICAL_HASH
    input_pointer: /selected_solution/queryir_emission_record/query_ir
    expected_hash_pointer: /selected_solution/queryir_emission_record/query_ir_sha256
  - id: PRJ-VERIFY_LEAF_TRACE
    operation: VERIFY_EVERY_NONROOT_PROPERTY_VALUE_AND_ARRAY_ITEM_POINTER_EXACTLY_ONCE
    input_pointer: /selected_solution/queryir_emission_record/query_ir
    trace_pointer: /selected_solution/queryir_emission_record/field_traces
  - id: PRJ-VERIFY_LICENSE_DAG
    operation: VERIFY_ROOTED_ACYCLIC_MATERIAL_OBJECT_COVERAGE
    input_pointer: /selected_solution/queryir_emission_record/license_dag
  - id: PRJ-VERIFY_MINIMALITY
    operation: VERIFY_REMOVAL_WITNESS_FOR_EVERY_MATERIAL_OBJECT
    input_pointer: /selected_solution/queryir_emission_record/minimality_witness
  - id: PRJ-EXTRACT_QUERYIR
    operation: BYTE_IDENTICAL_DEEP_COPY
    input_pointer: /selected_solution/queryir_emission_record/query_ir
    output_pointer: /

# This table is executable input, not explanatory prose.  It closes the former
# gap in which any schema-valid role could be attached to an otherwise valid
# relation.  A profile is selected only when every listed relation/event/entity
# condition is true.  The emitted semantic objects are then exact sets.
semantic_projection_profiles:
  - profile_id: SPR-DIAGNOSTIC-EXPOSURE-CLUE
    when:
      predicate: has_diagnostic_clue
      subject_entity_type: disease
      object_entity_type: behavior
      event_type: EXPOSURE
      event_target_equals_relation_object: true
      assertion_status: AFFIRMED
    required_roles:
      - role_namespace: TOPIC_SCOPE
        role_value: diagnosis
      - role_namespace: EVIDENCE_ROLE
        role_value: epidemiologic_exposure_clue
    required_narrative_intents:
      - topic_scope: diagnosis
        semantic_role: diagnostic_evidence_integration
        required_anchor_predicates: [has_diagnostic_clue]
        selector_from: RELATION_SUBJECT
      - topic_scope: diagnosis
        semantic_role: diagnostic_confirmation_limit
        required_anchor_predicates: [has_diagnostic_clue]
        selector_from: RELATION_SUBJECT

semantic_projection_closure:
  profile_selection: EXACT_ALL_CONDITIONS
  no_matching_profile: FAIL_CLOSED
  more_than_one_matching_profile: AMBIGUOUS_NO_QUERYIR
  required_roles: EXACT_SET_NO_OMISSION_NO_ADDITION
  required_narrative_intents: EXACT_SET_NO_OMISSION_NO_ADDITION
  queryir_semantic_arrays: EXACT_PROJECTION_FROM_TYPED_CORE
  synchronized_output_and_trace_mutation: FAIL_CLOSED_BY_CORE_RECOMPUTATION
  direct_relation_basis: EXACT_SELECTOR_MENTION_SET_BOUND_TO_EVENT_TARGET_SLOT_SOURCE
  event_derived_relation_basis: EXACT_BOUND_EVENT_PARTICIPANT_PROJECTION
  request_and_clause_binding: EXACT_NORMALIZED_REQUEST_AND_AST_PROJECTION
  query_ir_sha256: RECOMPUTED_FROM_ACTUAL_EMITTED_QUERYIR

forbidden_operations:
  - parse_query_text
  - resolve_entity_or_reference
  - infer_event_or_relation
  - add_remove_or_reorder_semantic_objects
  - widen_or_narrow_selector
  - change_assertion_or_temporal_scope
  - repair_trace_license_or_minimality_witness
  - consult_retrieval_result

reference_projection:
  source: selected_unique_solution.resolved_references + event_frame.reference_hypotheses + clause_ast
  mapping:
    reference_key: reference_id
    hypothesis.anaphor_source_id: [clause_id, anaphor_span]
    referent_key.kind: referent_kind
    referent_key: referent_id
    constant.RESOLVED: resolution_status
  forbidden: [copy_typed_reference_object, resolve_reference_in_s4]

override_projection:
  source: selected_unique_solution.resolved_overrides + event_frame.override_hypotheses + clause_ast
  mapping:
    override_key: override_id
    hypothesis.override_ast_node_id: override_clause_id
    earlier_event_key: earlier_event_id
    later_event_key: later_event_id
    executable_event_identity: same_normalized_event_identity
    constant.RESOLVED: resolution_status
  forbidden: [copy_typed_override_object, infer_override_in_s4]

determinism:
  output_bytes: "exact canonical bytes of embedded query_ir"
  any_rule_failure: "FAIL_CLOSED_NO_QUERYIR_NO_RETRIEVAL"
