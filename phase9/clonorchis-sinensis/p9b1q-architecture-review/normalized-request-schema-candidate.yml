$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/parasitology-kg/phase9/p9b1q/normalized-request-v0.1"
title: "P9-B1Q lossless normalized request candidate"
type: object
additionalProperties: false
required:
  - normalized_request_version
  - request_id
  - request_sha256
  - knowledge_version
  - locale
  - raw_query_text
  - normalized_query_text
  - normalization_operations
  - raw_to_normalized_spans
  - producer
properties:
  normalized_request_version: {const: "0.1-candidate"}
  request_id: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"}
  request_sha256: {$ref: "#/$defs/sha256"}
  knowledge_version: {const: "clonorchis_pcms_v1"}
  locale: {const: "zh-CN"}
  raw_query_text: {type: string, minLength: 1, maxLength: 2000}
  normalized_query_text: {type: string, minLength: 1, maxLength: 2000}
  normalization_operations:
    type: array
    maxItems: 64
    uniqueItems: true
    items: {enum: [NONE, CRLF_TO_LF, TAB_TO_SINGLE_SPACE, COLLAPSE_ASCII_SPACE_RUN]}
  raw_to_normalized_spans:
    type: array
    minItems: 1
    maxItems: 2048
    uniqueItems: true
    items: {$ref: "#/$defs/span_map"}
  producer:
    type: object
    additionalProperties: false
    required: [producer_id, producer_version, executable_sha256, configuration_sha256]
    properties:
      producer_id: {const: "p9b1q-request-normalizer"}
      producer_version: {type: string, minLength: 1, maxLength: 64}
      executable_sha256: {$ref: "#/$defs/sha256"}
      configuration_sha256: {$ref: "#/$defs/sha256"}
$defs:
  sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
  span_map:
    type: object
    additionalProperties: false
    required: [raw_start, raw_end, normalized_start, normalized_end]
    properties:
      raw_start: {type: integer, minimum: 0, maximum: 2000}
      raw_end: {type: integer, minimum: 1, maximum: 2000}
      normalized_start: {type: integer, minimum: 0, maximum: 2000}
      normalized_end: {type: integer, minimum: 1, maximum: 2000}
