manifest_id: P9B1Q-R3B-NEGATION-SCOPE-NEGATIVE
base_object: fixtures/r3b-negation-scope-positive.json
mutation_policy: EXACTLY_ONE_RFC6902_OPERATION_FROM_PASSING_BASE
cases:
