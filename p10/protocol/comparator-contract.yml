C_TO_D_INTERPRETATION: incremental_effect_of_D_specific_typed_semantic_constraint_enforcement
C_SCIENTIFIC_INTERPRETABILITY: RESOLVED

VECTOR_RAG_CONFIGURATION:
  embedding_provider: OpenAI
  embedding_model: text-embedding-3-large
  embedding_model_revision: PROVIDER_DOES_NOT_EXPOSE_IMMUTABLE_REVISION
  tokenizer: cl100k_base
  tokenizer_revision: FROZEN_WITH_INDEX_BUILD_ENVIRONMENT_AND_RECORDED_IN_BUILD_MANIFEST
  evidence_unit: ONE_VECTOR_PER_FROZEN_EVIDENCE_UNIT
  text_canonicalization:
    encoding: UTF-8
    unicode: NFC
    whitespace: canonical_single_space_with_trimmed_edges
    field_order: [EMBEDDING_TEXT]
    field_rule: canonical_ATOMIC_CLAIM_only_as_frozen_by_P10_AEM_V1
    graph_derived_enrichment: prohibited
  pooling_policy: PROVIDER_NATIVE_SINGLE_VECTOR_NO_CLIENT_POOLING
  vector_normalization: L2_UNIT_NORM_BEFORE_INDEX_SERIALIZATION
  similarity_metric: COSINE
  top_k: 8
  max_evidence_units: 8
  max_evidence_tokens: 4096
  index_implementation: exact_brute_force_float32_matrix
  index_implementation_version: NUMPY_2.3.5
  tie_break_policy: similarity_descending_then_evidence_id_UTF8_ascending
  index_build_input: P10_AUTHORITATIVE_EVIDENCE_MANIFEST_ONLY
  index_serialization_policy: little_endian_IEEE754_float32_plus_sorted_evidence_ID_table
  index_config_sha256_policy: SHA256_of_canonical_UTF8_JSON_configuration
  index_content_sha256_policy: >-
    SHA256 of canonical config digest, ordered evidence IDs, canonicalized text
    digests, embedding response model identifiers, and exact serialized vector bytes
  index_content_sha256: PRODUCED_ONLY_BY_AUTHORIZED_PRE_EXECUTION_INDEX_BUILD

EVIDENCE_EXPOSURE_PARITY:
  common_max_evidence_tokens: 4096
  common_max_evidence_units: 8
  token_counting: frozen_tokenizer_recorded_per_request
  actual_exposed_units_and_tokens_recorded: true
  deterministic_truncation: evidence_rank_then_evidence_ID_then_token_prefix
  admissible_token_tolerance: 0
  structural_limitation: A_receives_no_evidence_by_definition

EXECUTION_BOUNDARY:
  source_change_authorized: false
  system_execution_completed: false
  benchmark_execution_completed: false
