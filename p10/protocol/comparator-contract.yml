    evidence_representation: deterministic_common_evidence_renderer
    abstention_qualification: common_generation_instruction_only
  C:
    name: KG_RAG
    ablation_path: P9B1_FROZEN_GRAPH_RETRIEVAL_REUSE
    allowed_inputs: [benchmark_question, common_answer_instruction,
      P9B1_graph_retrieved_evidence]
