FREEZE_ID: P10_MODEL_GENERATION_FREEZE_V1
STATUS: FROZEN
SYSTEM_UNDER_EVALUATION: d77a76e6219482e1933e6377dfbad2151c829bef
P10_PROTOCOL_DOCUMENTATION_HEAD: CONTAINING_GIT_COMMIT

MODEL_PROVIDER: OpenAI
MODEL_ID: gpt-4.1-2025-04-14
MODEL_SNAPSHOT_OR_REVISION: gpt-4.1-2025-04-14
MODEL_REPRODUCIBILITY_STATUS: PINNED
API_VERSION: v1/responses
SDK_OR_RUNTIME: openai-python on CPython
OPENAI_PYTHON_VERSION: 3.13.0
CPYTHON_VERSION: 3.12.14

GENERATION:
  TEMPERATURE: 0
  TOP_P: 1
  MAX_OUTPUT_TOKENS: 1024
  STUDY_CONTEXT_LIMIT: 16384
  NUMBER_OF_RUNS_PER_QUESTION_SYSTEM: 1
  TIMEOUT_SECONDS: 120

SEED_POLICY:
  request_seed: NOT_SET
  reason: seed_is_not_part_of_the_frozen_generation_contract_for_this_endpoint
  deterministic_claim: prohibited
RETRY_POLICY:
  maximum_retries: 1
  permitted_causes:
    - transport_failure
    - rate_limit
    - timeout_before_response_creation
    - provider_HTTP_5xx
  retry_payload: BYTE_IDENTICAL
  retain_both_attempts: true
  retain_both_provider_request_IDs: true
  successful_response_regeneration: prohibited
  retry_log_required: true
  prohibited_output_based_causes:
    - weak
    - incorrect
    - incomplete
    - empty
    - refusal
    - malformed_but_returned
REQUEST_METADATA_POLICY:
  transmit:
    - blinded_question_identifier
    - blinded_comparator_run_identifier
    - protocol_version
  prohibit:
    - gold_content
    - tier_label
    - expected_action
    - comparator_identity_in_answer_prompt
  retain_per_request:
    - CANONICAL_REQUEST_SHA256
    - UTC_TIMESTAMP
    - PROVIDER_REQUEST_ID
    - REQUESTED_MODEL_STRING
    - RETURNED_MODEL_STRING
    - HTTP_STATUS
    - TOKEN_USAGE
    - RETRY_STATUS
    - RESPONSE_SHA256
    - AVAILABLE_PROVIDER_PROCESSING_METADATA
MODEL_VERSION_CAPTURE_POLICY:
  required_requested_model_string: gpt-4.1-2025-04-14
  required_returned_model_string: gpt-4.1-2025-04-14
  identifier_mismatch_action: FAIL_CLOSED_BEFORE_SCIENTIFIC_SCORING
  provider_side_mutability_disclosure: >-
    The dated model identifier is pinned. Provider infrastructure and serving
    implementation remain outside repository control and are recorded as a
    residual reproducibility limitation.

GENERATION_PROMPT_POLICY:
  one_common_answer_instruction_across_A_B_C_D: true
  condition_specific_prompt_tuning: prohibited
  post_result_prompt_tuning: prohibited
  evidence_context_present_only_where_defined_by_comparator_contract: true

EXECUTION_STATE:
  model_called: false
  benchmark_executed: false
  A_B_C_D_outputs_created: false
