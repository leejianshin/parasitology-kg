route_isolation:
  route_a:
    engine: NotebookLM/Gemini
    required_input: clonorchis_phase3_private_pack_v1_1
    forbidden_inputs:
      - "candidates/clonorchis-sinensis/notebooklm-gemini-v1.md"
      - "candidates/clonorchis-sinensis/notebooklm-gemini-v2.md"
      - "candidates/clonorchis-sinensis/notebooklm-gemini-v3.md"
      - "reviews/clonorchis-sinensis/"
      - "当前202来源Notebook"
      - "私有语料包以外的Notebook来源"
  route_b:
    engine: clean_context_independent_extractor
    required_input: clonorchis_phase3_private_pack_v1_1
    forbidden_inputs:
      - "candidates/"
      - "reviews/"
      - "路线A输出"
      - "本对话历史中的Notebook候选答案"

hard_gates:
  - id: source_manifest
    rule: "pack_id、4个证据文件的精确文件名、Drive ID及限定范围全部一致；否则停止"
  - id: atomicity
    rule: "每条命题只有一个主关系"
  - id: evidence_role
    rule: "题库和课件不得单独证明医学事实、最新诊疗或干预效果"
  - id: traceability
    rule: "每条命题至少有一个数字页码、PDF页序、条款或稳定URL"
  - id: no_source_substitution
    rule: "不同版次、相近文件、网页和Notebook额外来源不得替代私有语料包文件"
  - id: no_candidate_admission
    rule: "本阶段输出不得写入正式知识目录"

required_outputs:
  - source_manifest
  - claims
  - source_quality
  - omissions
  - conflicts
  - schema_issues
  - quality_check
