route_isolation:
  route_a:
    engine: NotebookLM/Gemini
    required_input: clonorchis_phase3_private_pack_v1_2
    expected_notebook_source_count: 8
    required_controls:
      - CONTROL_source-pack-manifest-v1.2.md
      - CONTROL_extraction-protocol-v1.2.md
      - CONTROL_candidate-template-v1.2.md
      - CONTROL_route-a-prompt-v1.2.md
    forbidden_inputs:
      - "candidates/clonorchis-sinensis/"
      - "reviews/clonorchis-sinensis/"
      - "当前202来源Notebook"
      - "Route B prompt"
      - "私有语料包以外的Notebook来源"
  route_b:
    engine: clean_context_independent_extractor
    required_input: clonorchis_phase3_private_pack_v1_2
    forbidden_inputs:
      - "candidates/"
      - "reviews/"
      - "路线A输出"
      - "本对话历史中的Notebook候选答案"

hard_gates:
  - id: phase_gate
    rule: "PR #4合并且教师明确启动前只允许PREFLIGHT_ONLY，claims必须为空"
  - id: source_manifest
    rule: "pack_id、4个证据文件的精确文件名、可观察身份、角色及限定范围一致；否则停止"
  - id: runtime_observability
    rule: "运行环境不可观察Drive ID或SHA256时标记not_observable，不得声称confirmed或mismatch"
  - id: atomicity
    rule: "每条命题只有一个主关系"
  - id: evidence_role
    rule: "题库、课件与大纲不得单独证明医学事实、最新诊疗或干预效果"
  - id: traceability
    rule: "E01用印刷页码；E02用TE编号；E03用条款；E04用复合定位"
  - id: no_source_substitution
    rule: "归档PDF、其他版次、网页、相近文件和Notebook额外来源不得替代E01–E04"
  - id: no_candidate_admission
    rule: "本阶段输出不得写入正式知识目录"

required_outputs_after_release:
  - source_manifest
  - claims
  - source_quality
  - omissions
  - conflicts
  - schema_issues
  - quality_check
